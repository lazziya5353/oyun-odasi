<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0f1218">
<meta name="robots" content="noindex">
<title>Oyun Odası · Yönetim</title>
<link rel="icon" type="image/svg+xml" href="logo.svg">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Figtree:wght@400;500;600&display=swap">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/bg.css">
<link rel="stylesheet" href="css/hava.css">
<style>
  body{overflow:auto}
  .adm{max-width:1320px;margin:0 auto;padding:24px 16px 60px;display:grid;gap:18px}
  .adm-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .adm-head h1{margin:0;font-family:var(--display);font-size:24px;display:flex;align-items:center;gap:10px;flex:1}
  .adm-card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;display:grid;gap:14px}
  .adm-login{max-width:380px;margin:12vh auto 0}
  .seg.adm-tabs{display:flex;flex-wrap:wrap;gap:6px;border:0;border-radius:0;overflow:visible}
  .adm-tabs button{border:1px solid var(--line)!important;border-radius:99px;padding:7px 13px}
  select.inp{max-width:260px}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .seg button{background:var(--panel-2);border:0;padding:9px 14px;font:inherit;font-size:14px;color:var(--fg);cursor:pointer}
  .seg button+button{border-left:1px solid var(--line)}
  .seg button.on{background:var(--accent);color:var(--accent-ink);font-weight:600}
  .u-list{display:grid;gap:10px}
  .u{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 14px;border-radius:14px;background:var(--bg);border:1px solid var(--line)}
  .u.yeni{animation:pop-in .25s ease}
  .u.bekliyor{border-color:color-mix(in srgb,var(--warn) 55%,var(--line))}
  .u-av{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:20px;color:#0f1218;background:var(--accent) center/cover no-repeat}
  .u-info{min-width:0;display:grid;gap:2px}
  .u-info b{font-size:16px}
  .u-info span{font-size:13px;color:var(--muted)}
  .u-acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
  .pill{font-size:11px;border-radius:99px;padding:2px 8px;background:var(--panel-2);color:var(--muted);margin-left:6px;vertical-align:2px}
  .pill.ok{background:color-mix(in srgb,var(--accent) 20%,transparent);color:var(--accent)}
  .pill.wait{background:color-mix(in srgb,var(--warn) 20%,transparent);color:var(--warn)}
  .pill.no{background:color-mix(in srgb,var(--danger) 20%,transparent);color:var(--danger)}
  .note.err{color:var(--danger)}
  .tmp{font-family:var(--display);font-size:18px;letter-spacing:.15em;color:var(--warn)}
  .u-acts.start{justify-content:flex-start;align-items:center}
  .inp{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 11px;font:inherit;font-size:15px;color:var(--fg);min-width:0}
  textarea.inp{resize:vertical}
  select.inp{padding:8px 10px}
  .ad-stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
  .ad-stat{display:grid;gap:2px;text-align:left;padding:14px;border-radius:14px;background:var(--bg);border:1px solid var(--line);color:var(--fg);font:inherit;cursor:pointer}
  .ad-stat:hover:not(:disabled){border-color:var(--accent)}
  .ad-stat b{font-family:var(--display);font-size:28px;line-height:1.1}
  .ad-stat span{font-size:13px;color:var(--muted)}
  .ad-banner{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border-radius:12px;background:color-mix(in srgb,var(--warn) 14%,transparent);border:1px solid color-mix(in srgb,var(--warn) 50%,var(--line))}
  .ad-cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;align-items:start}
  .ad-box{display:grid;gap:8px;padding:14px;border-radius:14px;background:var(--bg);border:1px solid var(--line);min-width:0}
  .ad-box h3,.u-list>h3{margin:4px 0 0;font-size:15px}
  .ad-mini{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:6px 0;border-top:1px solid var(--line);font-size:14px}
  .ad-mini>span:first-child{flex:1;min-width:120px;overflow-wrap:anywhere}
  .ad-mini .inp{flex:1}
  .ad-muted{color:var(--muted);font-size:13px}
  .ad-mini .btn.small{padding:4px 9px}
  .ad-banner.ok{background:color-mix(in srgb,var(--accent) 12%,transparent);border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
  .saka-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
  .saka-btn{display:grid;justify-items:center;gap:4px;padding:12px 6px;border-radius:14px;background:var(--panel-2);border:1px solid var(--line);color:var(--fg);font:inherit;font-size:13px;cursor:pointer;transition:transform .12s,border-color .12s}
  .saka-btn b{font-size:34px;line-height:1;font-weight:400}
  .saka-btn:hover{border-color:var(--accent);transform:translateY(-2px)}
  .saka-btn:active{transform:scale(.94)}
  .saka-grid.kucuk{grid-template-columns:repeat(auto-fill,minmax(92px,1fr))}
  .saka-grid.kucuk .saka-btn{padding:8px 4px;font-size:12px}
  .saka-grid.kucuk .saka-btn b{font-size:24px}
  .saka-btn.kapali{opacity:.4;text-decoration:line-through;border-style:dashed}
  .saka-engel{display:grid;gap:8px;padding-top:10px;border-top:1px solid var(--line)}
  .hk-satir{display:grid;grid-template-columns:auto auto 1fr auto;gap:10px;align-items:center;padding:7px 0;border-top:1px solid var(--line);font-size:14px}
  .hk-cihaz{font-size:18px}
  .hk-ad{white-space:nowrap}
  .hk-metin{overflow-wrap:anywhere}
  .hk-ozet{display:flex;flex-wrap:wrap;gap:6px}
  .hk-chip{padding:5px 10px;border-radius:99px;background:var(--panel-2);border:1px solid var(--line);font-size:13px}
  @media (max-width:600px){ .hk-satir{grid-template-columns:auto 1fr auto} .hk-metin{grid-column:1/-1} }
  .replik-liste{display:grid;gap:6px;max-height:420px;overflow:auto}
  .replik-satir{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:6px 0;border-top:1px solid var(--line)}
  .replik-ad{flex:1;min-width:160px;font-weight:600;overflow-wrap:anywhere}
  .replik-onizle{flex-basis:100%;max-width:420px;max-height:260px;border-radius:10px;background:#000}
  @media (max-width:600px){ .u{grid-template-columns:auto 1fr} .u-acts{grid-column:1/-1;justify-content:flex-start} }
  .replik-yukle{display:grid;gap:8px;padding:12px;border:1px dashed var(--line);border-radius:12px;margin-bottom:6px}
  .replik-yukle input[type=file]{font:inherit;font-size:13px;color:var(--muted)}
  .replik-yukle .inp[hidden]{display:none}
  /* video duvar kağıtları sekmesi */
  .dv-form{gap:10px}
  .dv-satir{display:grid;grid-template-columns:150px 1fr;align-items:center;gap:10px;margin:0;text-transform:none;letter-spacing:0;font-size:14px;color:var(--fg)}
  .dv-satir input[type=file]{font:inherit;font-size:13px;color:var(--muted);min-width:0}
  .dv-cubuk{height:10px;border-radius:99px;background:var(--panel-2);overflow:hidden}
  .dv-cubuk[hidden]{display:none}
  .dv-cubuk i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
  .dv-kat{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:8px}
  .dv-video{display:grid;grid-template-columns:120px 1fr auto;gap:12px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
  .dv-video img{width:120px;aspect-ratio:16/9;object-fit:cover;border-radius:8px;background:#0b0d14}
  .dv-bilgi{display:grid;gap:2px;min-width:0}
  .dv-bilgi b{overflow-wrap:anywhere}
  .dv-video .u-acts .inp{width:150px}
  @media (max-width:700px){ .dv-satir{grid-template-columns:1fr;gap:4px} .dv-video{grid-template-columns:96px 1fr} .dv-video img{width:96px} .dv-video .u-acts{grid-column:1/-1;justify-content:flex-start} }
  /* kelimeler sekmesi */
  .kl-yasak{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
  @media (max-width:700px){ .kl-yasak{grid-template-columns:1fr 1fr} }
  .kl-liste{display:grid;gap:2px;max-height:520px;overflow:auto}
  .kl-kart{display:flex;align-items:center;gap:10px;padding:6px 0;border-top:1px solid var(--line)}
  .kl-metin{flex:1;min-width:0;display:grid}
  .kl-metin b{font-size:15px}
  .kl-metin .ad-muted{overflow-wrap:anywhere}
  .kl-kart .btn.small{padding:4px 9px}
  .kl-chips{display:flex;flex-wrap:wrap;gap:6px;max-height:520px;overflow:auto}
  .kl-chip{display:inline-flex;align-items:center;gap:4px;padding:4px 4px 4px 10px;border-radius:99px;background:var(--panel-2);border:1px solid var(--line);font-size:13px}
  .kl-chip.yeni{border-color:var(--accent);color:var(--accent)}
  .kl-chip button{border:0;background:none;color:var(--muted);cursor:pointer;font-size:12px;width:20px;height:20px;border-radius:50%}
  .kl-chip button:hover{background:var(--danger);color:#fff}
  details.ad-box summary{cursor:pointer;font-weight:600}
  /* sol sütun: duvar kağıtları */
  .yan-ic{display:grid;gap:12px;align-content:start}
  .yd-bas{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .yd-su{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:14px}
  .yd-su b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .yd-kar{display:flex;align-items:center;gap:10px;margin:0;text-transform:none;letter-spacing:0}
  .yd-kar input{flex:1}
  .yd-izgara{display:grid;grid-template-columns:1fr 1fr;gap:8px;max-height:420px;overflow:auto;padding-right:2px;scrollbar-width:thin}
  .yd-izgara[hidden]{display:none}
  .yd-grup{grid-column:1/-1;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:6px 0 0}
  .yd-sec{display:grid;gap:4px;padding:4px 4px 6px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font:inherit;font-size:12px;font-weight:600;cursor:pointer;text-align:center;min-width:0}
  .yd-sec canvas{width:100%;aspect-ratio:16/10;height:auto;border-radius:7px;display:block;background:#0b0d14}
  .yd-sec span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .yd-sec.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
  .yd-sec:hover{border-color:var(--accent)}
  /* radyo mini çubuğu, kişi profili */
  .ad-radyo-mini{display:flex;align-items:center;gap:8px;padding:4px 6px 4px 12px;border-radius:99px;border:1px solid var(--line);background:var(--panel-2);font-size:13px;max-width:100%}
  .ad-radyo-mini span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:200px}
  .ad-radyo-mini input{width:80px}
  .ad-ad{cursor:pointer}
  .ad-ad:hover{text-decoration:underline;color:var(--accent)}
  dialog#kisiDlg{width:min(720px,94vw);max-height:90vh;padding:0;border:1px solid var(--line);border-radius:16px;background:var(--panel);color:var(--fg)}
  dialog#kisiDlg::backdrop{background:rgba(0,0,0,.55)}
  dialog#kisiDlg .dlg-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
  dialog#kisiDlg .dlg-head h3{margin:0}
  dialog#kisiDlg .dlg-body{max-height:calc(90vh - 64px);overflow:auto}
  dialog#kisiDlg .ad-stat b{font-size:22px}
  dialog#kisiDlg .ad-stats{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}
  .yan-btnler{display:flex;flex-wrap:wrap;gap:6px;padding:6px 0 2px}
  /* arka plan açıkken paneller cam gibi */
  :root[data-bg] :is(.adm-card,.yan-kutu){background:var(--glass);border-color:var(--glass-line);-webkit-backdrop-filter:var(--glass-fx);backdrop-filter:var(--glass-fx)}
  :root[data-bg] :is(.u,.ad-box,.ad-stat){background:color-mix(in srgb,var(--bg) 70%,transparent)}
  /* sol sütun: açık odalar + kişiler */
  .adm-govde{display:grid;grid-template-columns:330px minmax(0,1fr);gap:18px;align-items:start}
  .adm-ana{min-width:0}
  .adm-yan{position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto;display:grid;gap:12px;align-content:start;scrollbar-width:thin}
  .yan-kutu{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;gap:10px}
  .yan-kutu h3{margin:0;font-size:15px}
  .yan-oda{display:grid;gap:6px;padding:10px 12px;border-radius:12px;background:var(--bg);border:1px solid color-mix(in srgb,var(--accent) 45%,var(--line))}
  .pill.gizli{background:color-mix(in srgb,#a78bfa 22%,transparent);color:#c4b5fd;letter-spacing:0;font-family:inherit}
  .yan-oda.gizli{border-color:color-mix(in srgb,#a78bfa 55%,var(--line))}
  .btn.gizli-ver{border-color:color-mix(in srgb,#a78bfa 60%,var(--line))}
  .yan-oda-ust{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .yan-kod{font-family:var(--display);font-size:20px;letter-spacing:.14em;color:var(--accent)}
  .yan-sure{font-size:13px;font-weight:600;white-space:nowrap}
  .yan-chips{display:flex;flex-wrap:wrap;gap:5px}
  .yan-chips .hk-chip{padding:3px 9px;font-size:12px}
  .yan-seg{display:flex}
  .yan-seg button{flex:1;padding:7px 8px;font-size:13px}
  .yan-kisiler{display:grid;gap:4px}
  .yan-kisi{border-radius:12px;border:1px solid transparent}
  .yan-kisi.acik{background:var(--bg);border-color:var(--line)}
  .yan-kisi-bas{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;width:100%;padding:7px 8px;border:0;border-radius:12px;background:none;color:var(--fg);font:inherit;text-align:left;cursor:pointer}
  .yan-kisi-bas:hover{background:var(--panel-2)}
  .yan-av{position:relative;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:700;color:#0f1218;background:var(--muted)}
  .yan-kisi.on .yan-av{background:var(--accent)}
  .yan-durum{position:absolute;right:-1px;bottom:-1px;width:11px;height:11px;border-radius:50%;background:#6b7280;border:2px solid var(--panel)}
  .yan-kisi.on .yan-durum{background:#22c55e}
  .yan-bilgi{display:grid;min-width:0}
  .yan-bilgi b{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .yan-bilgi small{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
  .yan-kisi.on .yan-bilgi small{color:var(--fg)}
  .yan-ok{color:var(--muted);transition:transform .15s}
  .yan-kisi.acik .yan-ok{transform:rotate(180deg)}
  .yan-gecmis{display:grid;gap:2px;padding:0 12px 10px 54px;font-size:13px}
  .yan-olay{display:flex;justify-content:space-between;gap:8px;padding:3px 0;border-top:1px solid var(--line)}
  .yan-olay .ad-muted{white-space:nowrap;font-size:12px}
  @media (max-width:960px){
    .adm-govde{grid-template-columns:1fr}
    .adm-yan{position:static;max-height:none;overflow:visible}
    .yan-kisiler{max-height:360px;overflow:auto}
  }
</style>
</head>
<body>
<main class="adm" id="adm">
  <section class="adm-card adm-login" id="loginCard">
    <h1 class="brand" style="font-size:24px"><img src="logo.svg" alt="" width="44" height="44">Yönetim</h1>
    <p class="note">Yönetim paneline girmek için yönetici şifresini gir.</p>
    <form id="admForm" class="stack">
      <input type="password" id="admPw" placeholder="Yönetici şifresi" autocomplete="current-password" style="background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:11px 12px;font-size:16px">
      <button class="btn primary" type="submit">Giriş</button>
      <p class="note err" id="admErr"></p>
    </form>
  </section>

  <section id="panel" hidden class="stack" style="gap:18px">
    <div class="adm-head">
      <h1><img src="logo.svg" alt="" width="36" height="36">Oyun Odası · Yönetim</h1>
      <button class="btn small" id="pushBtn">🔔 Başvuru bildirimi al</button>
      <a class="btn small" href="./" style="text-decoration:none;color:inherit">↩ Siteye dön</a>
      <button class="btn small" id="outBtn">Çıkış</button>
    </div>
    <div class="adm-govde">
      <aside class="adm-yan" aria-label="Duvar kağıtları, açık odalar ve kişiler"><div class="yan-kutu" id="yanDuvar"></div><div class="yan-ic" id="yan"></div></aside>
      <div class="adm-card adm-ana">
        <div class="seg adm-tabs" id="tabs"></div>
        <input type="text" id="q" class="inp" placeholder="🔎 İsim ya da kullanıcı adı ara" hidden>
        <div class="u-list" id="list"></div>
      </div>
    </div>
  </section>
</main>
<dialog id="kisiDlg" aria-labelledby="kisiBaslik">
  <div class="dlg-head"><h3 id="kisiBaslik">👤 Kişi</h3><button class="btn small" type="button" onclick="document.getElementById('kisiDlg').close()">Kapat</button></div>
  <div class="dlg-body"></div>
</dialog>
<div class="toast" id="toast" hidden></div>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="js/config.js"></script>
<script src="js/admin.js"></script>
<script src="js/admin-saka.js"></script>
<script src="js/admin-yan.js"></script>
<script src="js/backgrounds.js"></script>
<script src="js/hava.js"></script>
<script src="js/admin-ek.js"></script>
<script src="js/dinlen.js"></script>
<script src="js/admin-duvar.js"></script>
<script src="js/games/ciz.js"></script>
<script src="js/games/tabu-kartlar.js"></script>
<script src="js/games/tabu.js"></script>
<script src="js/admin-icerik.js"></script>
</body>
</html>
