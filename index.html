<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ehliyet Sınav Kampı</title>
<meta name="description" content="Ehliyet e-sınav provaları, levha, geçiş üstünlüğü ve gösterge lambası antrenmanı">
<meta name="theme-color" content="#1d4f9c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ehliyet">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="/icon.svg">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: mobil öncelikli tek sütun; sınavda üstte sabit süre çubuğu, altta sabit gezinme çubuğu */
:root{
  --bg:#eef1f5; --surface:#ffffff; --fg:#152033; --muted:#5b6678; --line:#d5dbe4;
  --sign:#1d4f9c; --sign-fg:#ffffff; --yellow:#f4c21b; --ok:#1d8a4e; --bad:#c8322b; --okbg:#e3f3ea; --badbg:#fbe7e5;
  --scene:#dfe8d6;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12161d; --surface:#1b212b; --fg:#e8ecf2; --muted:#9aa5b5; --line:#2c3441;
  --sign:#3a74d0; --sign-fg:#ffffff; --yellow:#f4c21b; --ok:#3fbf78; --bad:#ef6a62; --okbg:#173326; --badbg:#3a1c1b; --scene:#2a3527; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12161d; --surface:#1b212b; --fg:#e8ecf2; --muted:#9aa5b5; --line:#2c3441;
  --sign:#3a74d0; --sign-fg:#ffffff; --yellow:#f4c21b; --ok:#3fbf78; --bad:#ef6a62; --okbg:#173326; --badbg:#3a1c1b; --scene:#2a3527; color-scheme:dark}
html,body{background:var(--bg)}
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{color:var(--fg);font:16px/1.5 var(--body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 32px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.wrap.quizmode{padding-bottom:84px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;letter-spacing:.01em}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}

.hero{background:var(--sign);color:var(--sign-fg);border-radius:14px;padding:20px 18px;display:flex;flex-direction:column;gap:10px;border:3px solid var(--sign-fg);box-shadow:0 0 0 3px var(--sign)}
.hero h1{font-size:clamp(2rem,9vw,2.8rem);font-weight:800;line-height:1;text-transform:uppercase}
.hero p{margin:0;opacity:.92;max-width:52ch}
.name-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.name-row label{font-size:.85rem;letter-spacing:.06em;text-transform:uppercase;font-weight:600}
.name-row input{flex:1;min-width:0;max-width:260px;padding:10px 12px;border-radius:8px;border:0;font:inherit;font-size:16px;background:#fff;color:#152033}

.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.fact{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 4px;text-align:center}
.fact b{display:block;font-family:var(--display);font-size:1.6rem;line-height:1;font-variant-numeric:tabular-nums}
.fact span{font-size:.75rem;color:var(--muted)}

.label{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px}
.seg button{border:0;border-radius:9px;padding:11px 8px;background:transparent;color:var(--fg);font-weight:600;display:flex;flex-direction:column;align-items:center;line-height:1.2}
.seg button small{font-weight:400;color:var(--muted);font-size:.78rem}
.seg button.on{background:var(--sign);color:var(--sign-fg)}
.seg button.on small{color:var(--sign-fg);opacity:.85}
.seg3{grid-template-columns:repeat(3,1fr)}
.seg3 button small{font-size:.72rem}
.seg3 .lv-orta.on{background:#d9601f}
.seg3 .lv-zor.on{background:#152033}
.test.lv-orta .sign{background:#d9601f;box-shadow:0 0 0 2px #d9601f}
.kurs-sec{display:flex;flex-direction:column;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.khead{display:flex;align-items:center;gap:10px}
.khead h2{font-size:1.6rem}
.kbadge{font-size:.72rem;font-weight:700;letter-spacing:.08em;background:var(--ok);color:#fff;padding:3px 8px;border-radius:6px}
.kgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.kbtn{display:flex;flex-direction:column;align-items:center;gap:0;padding:10px 4px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg);min-height:76px}
.kbtn b{font-family:var(--display);font-size:1.6rem;line-height:1;color:var(--ok)}
.kbtn span{font-size:.78rem;font-weight:600}
.kbtn small{font-size:.68rem;color:var(--muted);text-align:center}
.kbtn:hover,.kchip:hover{border-color:var(--ok)}
.kders{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.kchip{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font-weight:600;text-align:left;min-height:48px}
.kchip small{font-weight:400;color:var(--muted);font-size:.78rem;white-space:nowrap}
@media(max-width:360px){.kgrid{grid-template-columns:repeat(3,1fr)}}
.test.lv-zor .sign{background:#152033;box-shadow:0 0 0 2px #152033}
.qtext{white-space:pre-line}
.rv .q{white-space:pre-line}

.tests{display:flex;flex-direction:column;gap:10px}
.test{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;text-align:left;color:var(--fg);width:100%;min-height:76px}
.test:hover{border-color:var(--sign)}
.test .sign{flex:none;width:52px;height:52px;border-radius:50%;background:var(--sign);color:var(--sign-fg);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:1.05rem;border:3px solid var(--surface);box-shadow:0 0 0 2px var(--sign)}
.test .sign i{font-style:normal;white-space:nowrap;font-size:.82rem;letter-spacing:-.02em}
.test.full .sign i{font-size:1.05rem}
.test.full .sign{background:var(--yellow);color:#152033;box-shadow:0 0 0 2px #152033;border-radius:8px;transform:rotate(45deg)}
.test.full .sign i{transform:rotate(-45deg);font-style:normal}
.test.new .sign{background:var(--bad)}
.test div{min-width:0;flex:1}
.test h3{font-size:1.3rem;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.test p{margin:0;color:var(--muted);font-size:.9rem}
.tag{font-family:var(--body);font-size:.68rem;font-weight:700;letter-spacing:.06em;background:var(--bad);color:#fff;padding:2px 7px;border-radius:999px}
.best{font-size:.8rem;color:var(--sign);font-weight:600}
.note{font-size:.88rem;color:var(--muted);margin:0}

.learn{display:flex;flex-direction:column;gap:12px;border-top:2px dashed var(--line);padding-top:16px}
.learn h2{font-size:1.7rem}
.lcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.lcard h3{font-size:1.35rem}
.strip{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.strip svg{flex:none;width:46px;height:46px}
.brand{display:flex;align-items:center;gap:12px}
.brand img{width:52px;height:52px;border-radius:12px;flex:none;box-shadow:0 0 0 2px rgba(255,255,255,.5)}
.figure.dash{background:#0d1014}
.dashstrip{background:#0d1014;border-radius:10px;padding:8px}
.strip .scn{width:70px;height:70px;border-radius:8px}

/* sınav */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px 6px;display:flex;flex-direction:column;gap:6px;margin-top:-8px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:10px}
.bar h2{font-size:1.25rem;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .x{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:4px 10px;font-size:.85rem;flex:none}
.timer{font-family:var(--display);font-size:1.3rem;font-weight:700;font-variant-numeric:tabular-nums;background:var(--surface);border:1px solid var(--line);padding:1px 10px;border-radius:8px;flex:none}
.timer.low{color:var(--bad);border-color:var(--bad)}
.timer.free{font-size:1rem;color:var(--muted)}
.progress{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--sign);transition:width .2s}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:14px}
.qmeta{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.chip{font-size:.72rem;font-weight:600;letter-spacing:.05em;text-transform:uppercase;padding:3px 9px;border-radius:999px;background:var(--bg);color:var(--muted)}
.qtext{font-size:1.1rem;font-weight:500;margin:0}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;background:var(--bg);color:var(--fg);border:2px solid transparent;border-radius:10px;padding:10px 12px;min-height:52px;width:100%}
.opt .l{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:700;background:var(--surface);border:1px solid var(--line)}
.opt.sel{border-color:var(--sign)}
.opt.sel .l{background:var(--sign);color:var(--sign-fg);border-color:var(--sign)}
.opt.right{border-color:var(--ok);background:var(--okbg)}
.opt.right .l{background:var(--ok);color:#fff;border-color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.opt.wrong .l{background:var(--bad);color:#fff;border-color:var(--bad)}
.opt:disabled{cursor:default;opacity:1}
.feedback{border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.feedback.ok{background:var(--okbg)} .feedback.bad{background:var(--badbg)}
.feedback b{font-family:var(--display);font-size:1.25rem}
.feedback.ok b{color:var(--ok)} .feedback.bad b{color:var(--bad)}
.feedback p{margin:0}
.bottombar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.bottombar .in{max-width:680px;margin:0 auto;display:flex;gap:8px}
.bottombar .btn{flex:1}
.btn{border-radius:10px;padding:12px 16px;min-height:48px;font-weight:600;background:var(--surface);color:var(--fg);border:1px solid var(--line)}
.btn.primary{background:var(--sign);color:var(--sign-fg);border-color:var(--sign)}
.btn.warn{background:var(--yellow);color:#152033;border-color:var(--yellow)}
.btn:disabled{opacity:.4;cursor:default}
details.qlist{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
details.qlist summary{cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between;min-height:32px;align-items:center}
details.qlist summary::-webkit-details-marker{display:none}
details.qlist summary::after{content:"▾";color:var(--muted)}
details.qlist[open] summary::after{content:"▴"}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px;margin-top:10px}
.grid button{height:40px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font-weight:600;font-variant-numeric:tabular-nums;padding:0}
.grid button.done{background:var(--sign);color:var(--sign-fg);border-color:var(--sign)}
.grid button.cur{outline:2px solid var(--yellow);outline-offset:1px}
.confirm{background:var(--surface);border:2px solid var(--yellow);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.confirm p{margin:0}
.confirm .row{display:flex;gap:8px;flex-wrap:wrap}
.confirm .row .btn{flex:1}

.figure{margin:0;align-self:center;background:var(--bg);border-radius:12px;padding:10px;display:flex}
.figure svg{display:block;width:124px;height:124px}
.figure.scene svg{width:min(240px,70vw);height:auto;aspect-ratio:1;border-radius:8px}
.rv .figure svg{width:84px;height:84px}
.rv .figure.scene svg{width:150px;height:150px}

/* sonuç */
.result{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:14px;align-items:center;text-align:center}
.plate{display:flex;align-items:stretch;border:3px solid #152033;border-radius:8px;background:#fff;color:#152033;overflow:hidden;font-family:var(--display);font-weight:800}
.plate .tr{background:#1d4f9c;color:#fff;font-size:.85rem;padding:6px 7px;display:flex;align-items:flex-end}
.plate .pts{font-size:3.2rem;line-height:1;padding:8px 18px;font-variant-numeric:tabular-nums;letter-spacing:.04em}
.verdict{font-family:var(--display);font-size:1.6rem;font-weight:800;text-transform:uppercase}
.verdict.pass{color:var(--ok)} .verdict.fail{color:var(--bad)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;width:100%}
.stats div{background:var(--bg);border-radius:10px;padding:10px 2px}
.stats b{display:block;font-family:var(--display);font-size:1.7rem;line-height:1;font-variant-numeric:tabular-nums}
.stats span{font-size:.72rem;color:var(--muted)}
.stats .g b{color:var(--ok)} .stats .r b{color:var(--bad)}
.stats button{background:var(--bg);border:1px solid transparent;border-radius:10px;padding:10px 2px;color:var(--fg);display:flex;flex-direction:column;align-items:center}
.stats button.r{border-color:var(--bad);background:var(--badbg)}
.stats button b{display:block;font-family:var(--display);font-size:1.7rem;line-height:1;font-variant-numeric:tabular-nums}
.stats button span{font-size:.72rem;color:var(--muted)}
.bigbad{width:100%;background:var(--bad);color:#fff;border-color:var(--bad);font-size:1.1rem;display:flex;flex-direction:column;align-items:center;gap:2px;padding:14px}
.bigbad small{font-weight:400;opacity:.9;font-size:.85rem}
div.opt{cursor:default}
.feedback p b{font-family:inherit;font-size:inherit;color:var(--fg)}
.feedback .why2{color:var(--fg)}
.cats{width:100%;display:flex;flex-direction:column;gap:8px;text-align:left}
.cat{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;font-size:.92rem}
.cat .track{grid-column:1/-1;height:8px;background:var(--bg);border-radius:4px;overflow:hidden}
.cat .track i{display:block;height:100%;background:var(--sign)}
.cat em{font-style:normal;font-variant-numeric:tabular-nums;color:var(--muted)}
.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;width:100%}
.actions .btn{flex:1;min-width:140px}
.sec{font-size:1.5rem;margin-top:6px}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters button{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:8px 12px;font-size:.88rem}
.filters button.on{background:var(--sign);color:var(--sign-fg);border-color:var(--sign)}
.review{display:flex;flex-direction:column;gap:10px}
.rv{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;scroll-margin-top:80px}
.rv.ok{border-left-color:var(--ok)} .rv.bad{border-left-color:var(--bad)} .rv.empty{border-left-color:var(--yellow)}
.rv p{margin:0}
.rv .q{font-weight:600}
.ans .you{color:var(--bad)}
.olist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;font-size:.93rem}
.olist li{padding:6px 10px;border-radius:8px}
.olist li.right{background:var(--okbg);color:var(--ok);font-weight:600}
.olist li.you{background:var(--badbg);color:var(--bad)}
.why{font-size:.9rem;color:var(--muted)}
.why b{color:var(--fg)}
.key{display:grid;grid-template-columns:repeat(auto-fill,minmax(50px,1fr));gap:6px}
.kc{position:relative;display:flex;flex-direction:column;align-items:center;padding:6px 2px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg)}
.kc small{font-size:.7rem;color:var(--muted);font-variant-numeric:tabular-nums}
.kc b{font-family:var(--display);font-size:1.3rem;line-height:1}
.kc .ys{font-style:normal;position:absolute;top:2px;right:5px;font-size:.7rem;color:var(--bad)}
.kc.ok{background:var(--okbg);border-color:var(--ok)} .kc.ok b{color:var(--ok)}
.kc.bad{background:var(--badbg);border-color:var(--bad)} .kc.bad b{color:var(--bad)}
.kc.empty{border-color:var(--yellow)}
@media(max-width:380px){.facts,.stats{grid-template-columns:repeat(2,1fr)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
// [ders, set, soru, şıklar, doğru index, neden doğru, levha?]
const Q = [
// =================== SET 1 : 2020–2021 ===================
["T",1,"Yerleşim yeri içinde otomobiller için azami hız sınırı kaç km/saattir?",["30","50","70","82"],1,"Yerleşim yeri içinde otomobil, kamyonet ve motosikletler için genel azami hız 50 km/saattir."],
["T",1,"Şekildeki levha sürücüye ne anlatır?",["Yavaşlayıp durmadan geç","Park etmek yasak","Dur, kavşaktaki araçlara yol ver, sonra geç","Sadece gece dur"],2,"Kırmızı sekizgen DUR levhasında tam duruş zorunludur; yol verildikten sonra güvenli olunca geçilir.","dur"],
["T",1,"Trafik işaretiyle düzenlenmemiş bir kavşakta geçiş hakkı kimindir?",["Soldan gelen aracın","Hızlı giden aracın","Büyük aracın","Sağdan gelen aracın"],3,"Işık, levha veya görevli yoksa kavşağa sağdan gelen araca yol verilir."],
["T",1,"90 km/saat hızla giden otomobil öndeki araçla arasında en az kaç metre takip mesafesi bırakmalıdır?",["20","30","45","90"],2,"Takip mesafesi en az hızın yarısı kadar metre olmalıdır: 90 ÷ 2 = 45 m."],
["T",1,"Trafik ışıklarında yanıp sönen sarı ışık ne anlama gelir?",["Dur","Geri dön","Kırmızı yanacak, hazırlan","Yavaşla, dikkatli geç"],3,"Yanıp sönen sarı ışık uyarıdır; hız azaltılıp dikkatle geçilir."],
["T",1,"Arkadan sireni açık bir ambulans yaklaşıyorsa sürücü ne yapmalıdır?",["Hızlanıp önünden kaçmalı","Sağa yanaşıp yol vermeli","Şeritte aniden durmalı","Sola yanaşmalı"],1,"Geçiş üstünlüğü olan araçlara sağa yanaşarak, gerekirse durarak yol verilir."],
["T",1,"Yol ortasındaki devamlı (düz) çizgi sürücüye ne anlatır?",["Üzerinden geçilemez, şerit değiştirilemez","Sadece gündüz geçilebilir","Öndeki araç geçilebilir","Park yapılabilir"],0,"Devamlı çizgi geçme ve şerit değiştirme yasağı bildirir."],

// Orta ve zor sorularda şıkları sabit tohumla karıştır (I-II-III tipleri hariç)
(function(){
  let seed = 555;
  const rnd = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  Q.forEach(q => {
    if (q[1] < 5 || /^(Yalnız|I )/.test(q[3][0])) return;
    const right = q[3][q[4]], o = q[3].slice();
    for (let i = o.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [o[i], o[j]] = [o[j], o[i]]; }
    q[3] = o; q[4] = o.indexOf(right);
  });
})();
