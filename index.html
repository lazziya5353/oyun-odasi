["T", 11, "Ambulans, itfaiye aracı, polis aracı ve iş makinesi görev hâlindeyken bir kavşakta karşılaşırsa ilk geçiş hakkını hangisi kullanır?", ["İş makinesi", "Polis aracı", "Ambulans", "İtfaiye aracı"], 2, "Öncelik sırası: ambulans (ve organ nakil aracı), itfaiye, polis. Sarı tepe lambalı iş makinelerinin ve kurtarıcıların geçiş üstünlüğü yoktur."],
["A", 11, "• Doğrultu değiştirme manevralarını yanlış yapmak\n• Önde giden bir aracı güvenli ve yeterli mesafeden izlememek\nYukarıdakiler, trafik kazalarında rol oynayan faktörlerin hangisinin içinde değerlendirilir?", ["Araç kusurları", "Yaya kusurları", "Yolcu kusurları", "Sürücü kusurları"], 3, "İkisi de direksiyondaki kişinin hatasıdır. Kazalarda en büyük pay sürücü kusurlarınındır."],
["T", 11, "Motorlu bisiklet, motosiklet ve sürücüleri ile ilgili olarak aşağıdakilerden hangisinin yapılması yasaktır?", ["Gidiş yönüne göre yolun en sağından seyredilmesi", "İkiden fazlasının taşıt yolunun bir şeridinde yan yana sürülmesi", "Tehlikeli madde taşıyan araçların geçilmesi", "Geçme yaparken sinyal verilmesi"], 1, "Bir şeritte en fazla iki motosiklet yan yana gidebilir; daha fazlası diğer trafiği tehlikeye sokar."],
["A", 11, "Boşaltıldığı ortamda çevre kirliliği meydana getirecek maddelere ne ad verilir?", ["Kireç", "Atık", "Yanıcı madde", "Yakıcı madde"], 1, "Atık; kullanılmış yağ, akü, lastik gibi doğaya atıldığında kirlilik yaratan maddelerdir. Bunlar toplama noktalarına verilmelidir."],
["T", 11, "Araçların muayene süresi dolmasa bile, aşağıdaki hâllerin hangisinden dolayı özel muayenesi zorunludur?", ["Kazaya karışması sonucu yetkili görevli tarafından gerekli görüldüğünde", "Sürücüsü veya işleteni değiştiğinde", "Motoru bakımdan geçirildiğinde", "Sahibi değiştiğinde"], 0, "Kazada hasar gören aracın yola çıkması güvenli mi diye özel muayene istenebilir. Sahip değişikliği veya rutin bakım özel muayene gerektirmez."],
["T", 11, "Trafik görevlisi geceleyin ışıklı işaret çubuğunu başının üzerinden bir yandan diğer yana yay çizecek şekilde sallıyorsa bu işaretin sürücüler için anlamı nedir?", ["Hızlandırma işareti", "Yavaşlatma işareti", "Geç işareti", "Dur işareti"], 3, "Geceleyin görevli ışıklı çubuğu başının üzerinden yay çizerek sallarsa bu, gündüzki el kaldırma gibi DUR anlamına gelir; bütün sürücüler durur."],
["T", 11, "Aksine bir durum yoksa, ışıklı trafik işaret cihazında yeşil ışık yanmakta ise sürücü ne yapmalıdır?", ["Durmalı, yolu kontrol ettikten sonra geçmeli", "İlk geçiş hakkı yayaların olduğu için beklemeli", "Sağdan gelen araçların geçmesini beklemeli", "Durmadan dikkatli geçmeli"], 3, "Yeşil ışık o yöne geçiş izni verir; durmadan ama dikkatle, kavşağa giren yaya ve araçları gözeterek geçilir."],
["T", 11, "Üçgen tehlike uyarı levhasında bez rüzgâr hortumu (rüzgâr külahı) çizimi neyi bildirir?", ["Havaalanı", "Yandan rüzgâr", "Sağdan daralan kaplama", "Gevşek malzemeli kaplama"], 1, "Rüzgâr külahı yandan esen kuvvetli rüzgârı gösterir; direksiyon sıkı tutulur, hız azaltılır. Uçak çizimi havaalanı, taş sıçratan tekerlek gevşek malzemeli kaplamadır."],
["T", 11, "Aşağıdaki trafik işaretlerinden hangisi tali yolda bulunur?", ["Ana yol – tali yol kavşağı levhası", "Tali yolun ana yola soldan katılması levhası", "Sağdan tali yol kavşağı levhası", "DUR levhası"], 3, "İlk üç levha ana yoldaki sürücüyü yaklaşan kavşağa karşı uyarır. DUR levhası tali yoldan ana yola çıkan sürücü içindir."],
["T", 11, "Üç şeritli, iki yönlü bir kara yolunda hangi şerit sürekli işgal edilemez?", ["Kendi yönündeki sağ şerit", "Ortadaki şerit", "Karşı yönün sağ şeridi", "Sağdaki iki şerit"], 1, "Ortadaki şerit iki yönün de geçiş için ortak kullandığı şerittir; geçme bitince sağ şeride dönülür, orta şeritte sürekli gidilmez."],
["A", 11, "Aşağıdakilerden hangisi, trafik kazası sırasında sürücü ve yolcunun taşıttan dışarı fırlamasını ya da başını çarpmasını önler?", ["Engel işareti", "Çekme halatı", "Boyun korsesi", "Emniyet kemeri"], 3, "Emniyet kemeri çarpma anında vücudu koltukta tutar; fırlama ve ön cama çarpma kazalardaki ölümlerin başlıca nedenlerindendir."],
["M", 11, "Kışın akünün donmaması için aşağıdakilerden hangisi yapılır?", ["Akünün yarım şarjlı olmasına dikkat edilir", "Akünün tam şarjlı olmasına dikkat edilir", "Akünün içerisine antifriz konur", "Akünün içerisine saf su konur"], 1, "Şarjı düşük akünün elektroliti sulanır ve kolay donar; tam şarjlı akünün donma noktası çok düşüktür. Aküye antifriz konmaz."],
["M", 11, "Dizel motorlarda sıkıştırılmış hava üzerine enjektörle aşağıdakilerden hangisi püskürtülür?", ["Motorin", "Antifriz", "Su buharı", "Hidrolik yağı"], 0, "Dizel motorda sıkıştırılarak ısınan havaya motorin püskürtülür ve kendiliğinden tutuşur."],
["M", 11, "Aşağıdakilerden hangisinin periyodik bakımı yapılmadığında motorda yeterli miktarda yağlama gerçekleşmez?", ["Hava filtresi", "Yağ filtresi", "Yakıt filtresi", "Polen filtresi"], 1, "Tıkanan yağ filtresi yağın dolaşımını zorlaştırır. Polen filtresi kabin havası, hava filtresi motor havası, yakıt filtresi yakıt içindir."],
["M", 11, "Akü üzerinde bulunan kontrol gözünde, akü şarjının iyi durumda olduğunu gösteren renk hangisidir?", ["Sarı", "Yeşil", "Siyah", "Kırmızı"], 1, "Yeşil şarjın iyi olduğunu, siyah şarj gerektiğini, açık renk veya sarı ise akünün değiştirilmesi gerektiğini gösterir."],
["M", 11, "Vites kutusundan gelen hareketi arka diferansiyele ileten güç aktarma organının adı nedir?", ["Aks", "Kardan mili (şaft)", "Volan", "Krank mili"], 1, "Kardan mili (şaft) vites kutusu ile diferansiyel arasındadır. Aks diferansiyelden tekerleklere, volan ise motordan debriyaja hareket iletir."],
["M", 11, "Aracın gelecekteki performansı için motorun alıştırılması (rodaj) sürecinde aşağıdakilerden hangisi yapılmalıdır?", ["Uzun yolda aynı hızla gidilmeli", "Sürekli sert ve ani fren yapılmalı", "Motor soğukken çok çabuk hızlanılmalı", "Tam gazdan ve ani hızlanmalardan kaçınılmalı"], 3, "Rodajda yeni parçalar birbirine alışır; tam gaz ve ani yüklenme aşınmayı artırır. Uzun süre sabit devirde gitmek de önerilmez."],
["M", 11, "Aküden gelen düşük gerilimi, buji tırnakları arasında kıvılcım oluşturacak şekilde yüksek gerilime dönüştüren ateşleme sistemi elemanına ne ad verilir?", ["Sigorta", "Konjektör", "Kontak anahtarı", "Endüksiyon bobini"], 3, "Endüksiyon (ateşleme) bobini 12 voltu binlerce volta yükseltir; konjektör (distribütör) bu akımı sırayla bujilere dağıtır."],
["M", 11, "Aşağıdakilerden hangisi akünün kendiliğinden boşalmasına neden olur?", ["Kutup başlarının sıkı olması", "Kutup başlarının temiz olması", "Akü etiketinin yırtılması", "Üst kısmında pisliklerin birikmesi"], 3, "Akünün üstündeki kir ve nem kutuplar arasında kaçak akım yolu oluşturur; akü kullanılmasa da boşalır."],
["M", 11, "Dizel motorlarda depodaki yakıtı yakıt enjeksiyon pompasına gönderen parça aşağıdakilerden hangisidir?", ["Enjektör", "Yakıt filtresi", "Besleme pompası", "Yakıt göstergesi"], 2, "Besleme pompası yakıtı depodan çekip filtreden geçirerek enjeksiyon pompasına yollar; enjektör yakıtı silindire püskürtür."],
["M", 11, "Temiz kireçsiz su ile donmayı ve korozyonu önleyici antifriz karışımından oluşan sıvıya ne ad verilir?", ["Motor yağı", "Fren hidroliği", "Akü elektroliti", "Motor soğutma suyu"], 3, "Soğutma suyu, kireçsiz su ve antifriz karışımıdır. Akü elektroliti saf su ile sülfürik asittir."],
["M", 11, "Hangisi, alternatörün üretmiş olduğu elektriğin voltajını ve şiddetini kontrol altında tutan şarj sistemi parçasıdır?", ["Regülatör", "Sigorta", "Karbüratör", "Marş motoru DENEME SINAVI 1 -"], 0, "Regülatör, alternatörün ürettiği voltajı ve akımı sınırlar; aküyü aşırı şarjdan, elektrik devresini yüksek gerilimden korur."],
["I", 12, "Belli bir görevi yapan farklı dokuların bir araya gelmesiyle oluşan vücut birimine ne ad verilir?", ["Hücre", "Organ", "Sistem", "Destek doku"], 1, "Hücreler dokuyu, dokular organı, organlar sistemi oluşturur. Belli bir görevi yapan doku topluluğu organdır (kalp, akciğer gibi)."],
["I", 12, "Kalp masajı uygulanabilmesi için kazazedede kesinlikle olması gereken durum aşağıdakilerden hangisidir?", ["Bilinç kaybı olması", "Reflekslerin kaybolması", "Sesli uyaranlara tepki vermemesi", "Dolaşımın durması, kalp atımlarının alınamaması"], 3, "Kalp masajı ancak dolaşım durduğunda yapılır; kalbi çalışan birine bası yapmak zarar verir. Sadece bilinç kaybı yeterli değildir."],
["I", 12, "Aşağıdakilerden hangisi atardamar kanamasının özelliğidir?", ["Açık renkli kanın, yara ağzından kalp atımlarına uyumlu şekilde fışkırarak akması", "Düşük basınçla akması ve kısa sürede durdurulabilmesi", "Koyu renkli ve taşma tarzında kan akması", "Kanamanın sızıntı şeklinde olması"], 0, "Atardamar kanı kalpten pompalandığı için açık kırmızıdır ve nabızla uyumlu fışkırır; en hızlı kan kaybı bu kanamadadır."],
["I", 12, "Aşağıdakilerden hangisi çıkık belirtisi değildir?", ["Eklemde morarma ve şişlik", "Eklem bölgesinde şekil bozukluğu", "Eklemde hareket kısıtlılığı veya kaybı", "Eklem hareket ettirildiğinde azalan ağrı"], 3, "Çıkıkta ağrı, şişlik, şekil bozukluğu ve hareket kaybı olur; eklem oynatıldığında ağrı azalmaz, artar."],
["I", 12, "Kazazedenin naklinden önce, yaralanmalarda uygulanan genel ilk yardım kuralı aşağıdakilerden hangisidir?", ["Yarayı sargı bezi ile kapattıktan sonra yaralı bölgeyi sabitlemek", "Yara üzerine merhem sürüp yarayı sarmak", "Yara üzerine tentürdiyot sürüp bırakmak", "Yarayı temiz pamukla kapatmak"], 0, "Yara temiz sargı beziyle kapatılır, sonra bölge sabitlenip taşınır. Merhem, tentürdiyot ve pamuk kullanılmaz."],
["I", 12, "Kişinin çevre ile bağlantısının tamamen kesildiği, uyaranlara cevap veremediği derin bilinç kaybına ne denir?", ["Hâlsizlik", "Şok", "Kansızlık", "Koma"], 3, "Koma, uyaranlara yanıt alınamayan derin bilinç kaybıdır. Bayılma ise kısa süreli ve geçicidir."],
["I", 12, "Aşağıdakilerden hangisinin yarı oturuş veya oturuş pozisyonunda taşınması sakıncalıdır?", ["Kaburgalarında kırık olanlar", "Kalça kemiğinde kırık olanlar", "Açık göğüs yaralanması olanlar", "Kol ve köprücük kemiğinde kırık olanlar"], 1, "Kalça kırığında oturtmak kırık uçlarını oynatır; bu yaralılar sırt üstü taşınır. Göğüs ve kaburga yaralanmalarında ise yarı oturuş solunumu kolaylaştırır."],
["I", 12, "Aşağıdakilerden hangisinin kaza anında kırılması hâlinde, akciğerlere batarak zarar verme ihtimali daha fazladır?", ["Pazı kemiği", "Kaval kemiği", "Kaburga kemiği", "Uyluk kemiği"], 2, "Kaburgalar akciğerleri saran kafesi oluşturur; kırılan kaburganın sivri ucu akciğeri delebilir."],
["I", 12, "Burkulan eklem bölgesinin şişmesini önlemek için yapılması gereken uygulama aşağıdakilerden hangisidir?", ["Burkulan bölgenin kalp seviyesinden yukarıda ve soğuk tutulması", "Burkulan bölgenin kalp seviyesinden aşağıda ve sıcak tutulması", "Burkulan bölgenin sürekli hareket ettirilmesi", "Kişinin yan yatış pozisyonuna alınması"], 0, "Bölgeyi kalp seviyesinin üstünde tutmak ve soğuk uygulamak şişliği azaltır. Sıcak uygulama ve hareket şişliği artırır."],
["I", 12, "Kaza yerine ulaşan ilk yardımcının öncelikle yapması gereken nedir?", ["Yaralıları belirlemek", "Yaralıları araçtan çıkarmak", "Kazayı yetkililere haber vermek", "Kendisinin ve yaralıların güvenliğini sağlamak"], 3, "İlk iş olay yeri güvenliğidir: kendini ve yaralıları yeni bir kazadan koru. Güvensiz ortamda ilk yardımcı da kazazede olur."],
["I", 12, "Yaralının araçtan çıkarılması esnasında en çok hangisine dikkat edilmelidir?", ["Hızlı ve aceleci davranmaya", "Kazayı seyredenlerin uzaklaştırılmasına", "Kaza yapan araca hasar verilmemesine", "Yaralıda yeni bir yaralanma meydana gelmemesine"], 3, "Yanlış çıkarma omurga gibi yaralanmaları ağırlaştırır; amaç yaralıya yeni bir zarar vermemektir."],
["I", 12, "Aşağıdaki kanama türlerinden hangisinde, kan kaybı diğerlerine nazaran fazla olduğu için daha kısa sürede hayati tehlike meydana gelir?", ["Burun kanamaları", "Atardamar kanamaları", "Kılcal damar kanamaları", "Toplardamar kanamaları"], 1, "Atardamarda kan basınçla fışkırır, kısa sürede çok kan kaybedilir; bu yüzden en tehlikeli kanama türüdür."],
["I", 12, "Yanık derecesini belirlemede aşağıdakilerden hangisi diğerlerine nazaran daha önemlidir?", ["Yakıcı maddeyle temas şekli", "Yakıcı etkiyi gösteren maddenin miktarı", "Yaralının üzerinde bulunan giysilerin cinsi", "Yanık yüzeyinin genişliği ve yanığın derinliği"], 3, "Yanığın ciddiyetini en çok ne kadar geniş bir alanı kapladığı ve ne kadar derine indiği belirler."],
["T", 12, "Şekildeki levha neye yaklaşıldığını bildirir?", ["Kontrolsüz demir yolu geçidine", "Tek hatlı demir yolu geçidine (çarpı işareti)", "Kavşakta durulacak yere", "Kontrollü (bariyerli) demir yolu geçidine"], 3, "Üçgen içinde çit (bariyer) çizimi kontrollü, yani bariyerli hemzemin geçidi bildirir. Lokomotif çizimi kontrolsüz geçittir.", "demiryolu"],
["T", 12, "Üçgen içinde kürek kullanan bir işçi çizimi bulunan tehlike uyarı levhası sürücüye neyi bildirir?", ["Yolda çalışma olduğunu", "Yolda gizli buzlanma olabileceğini", "Kaza sebebiyle yolun trafiğe kapatıldığını", "Düşük banketli yol kesimine yaklaşıldığını"], 0, "Üçgen içinde kürek kullanan işçi çizimi yolda çalışma olduğunu bildirir; hız azaltılır, işaretlere uyulur."],
["T", 12, "Koşulların uygun olması hâlinde sürücü kesik yol çizgileri boyunca aşağıdakilerden hangisini yapabilir?", ["Diğer şeride geçemez.", "Önündeki aracı geçebilir.", "Takip mesafesini azaltabilir.", "Sol şeritte sürekli seyredebilir."], 1, "Kesik çizgi, güvenli olduğu sürece şerit değiştirmeye ve öndeki aracı geçmeye izin verir."],
["T", 12, "Bir kavşakta 1 numaralı aracın yolunda DUR, 2 numaralı aracın yolunda YOL VER levhası var; 3 numaralı araç ana yolda. Aşağıdakilerden hangisinin yapılması yasaktır?", ["1 numaralı aracın sola dönüş yapması", "3 numaralı aracın sola dönüş yapması", "2 numaralı aracın sağa dönüş yapması", "1 numaralı aracın durmadan kavşağa girmesi"], 3, "DUR levhası olan yolda araç kavşağa girmeden önce tam durmak zorundadır; durmadan girmek yasaktır."],
["T", 12, "Kavşakta sağa dönüş yapacak olan sürücü aşağıdakilerden hangilerini yapmalıdır?\nI. Sağa dönüş lambasını yakmalı\nII. Hızını azaltmalı\nIII. Dar bir kavisle dönmeli", ["Yalnız I", "I ve II", "II ve III", "I, II ve III"], 3, "Sağa dönüşte önceden sinyal verilir, hız azaltılır ve kavşağa yakın, dar bir kavisle dönülür."],
["T", 12, "110 km/saat hızla seyreden bir aracın, önündeki aracı takip mesafesi en az kaç metre olmalıdır?", ["65", "60", "55", "50"], 2, "Takip mesafesi en az hızın yarısı kadar metredir: 110 ÷ 2 = 55 m."],
["T", 12, "Aşağıdaki levhalardan hangisi azami hız sınırlaması anlamındadır?", ["Kırmızı çerçeveli daire içinde 70 yazan levha", "İçinde 7,00 t yazan levha", "Üzeri çapraz çizgili, gri 50 yazan levha", "İçinde 70 m yazan levha"], 0, "Kırmızı çerçeveli daire içindeki sayı azami hızı bildirir. 7,00 t ağırlık, 70 m mesafe sınırıdır; gri çizgili levha sınırın sonudur."],
["T", 12, "Yerleşim birimleri dışındaki kara yollarında kavşak, tünel ve köprülere 100 metre mesafede, sürücünün aşağıdakilerden hangisini yapması uygundur?", ["Hızını artırması", "Hızını azaltması", "Şerit değiştirmesi", "Taşıt yolu üzerinde duraklaması"], 1, "Kavşak, tünel ve köprü gibi tehlikeli yerlere yaklaşırken hız azaltılır; buralarda geçme ve duraklama da yasaktır."],
["T", 12, "Tehlikeli madde taşıyan araç sürücüleri, yerleşim birimleri dışındaki kara yollarında diğer araçları en az kaç metre mesafeden takip etmek zorundadır?", ["20", "30", "40", "50"], 3, "Tehlikeli madde taşıyan araçlar, yerleşim yeri dışında birbirlerini ve diğer araçları en az 50 m mesafeden izler."],
["T", 12, "Bir yaya geçidinde karşıya geçen yaya ile traktör, otomobil ve motosiklet karşılaşıyor. İlk geçiş hakkını hangisi kullanmalıdır?", ["Yaya", "Traktör", "Otomobil", "Motosiklet"], 0, "Yaya geçidindeki yayanın önceliği her araçtan önce gelir; traktör, otomobil ve motosiklet yayaya yol verir."],
["T", 12, "Aşağıdakilerden hangisi araçlar için duraklamayı ifade eder?", ["Yolcu indirirken beklemek", "5 dakikadan fazla beklemek", "Kırmızı ışık yanarken beklemek", "Görevlilerce verilen emirle durmak"], 0, "Yolcu indirip bindirmek veya yük almak için kısa süre beklemek duraklamadır. Kırmızıda veya görevlinin emriyle beklemek 'durma'dır."],
["T", 12, "Geceleyin, görüşün yeterli olmadığı kavşağa yaklaşan sürücü gelişini nasıl haber vermelidir?", ["Dönüş ışıklarını yakarak", "Birkaç defa korna çalarak", "Acil uyarı ışıklarını yakarak", "Birkaç defa selektör yaparak"], 3, "Geceleyin korna yerine selektörle uyarı yapılır; görüşü kısıtlı kavşağa yaklaşırken birkaç kez selektör yapılır."],
["T", 12, "Sürücüler dönüşlerde aşağıdakilerden hangisini yapmak zorundadır?", ["Niyetini dönüş lambasıyla önceden bildirmek", "İşaret verdiği anda aniden şerit değiştirmek", "Dönmeye başladıktan sonra işaret vermek", "Arkadan gelen araçlara yol vermek"], 0, "Dönüş niyeti sinyal lambasıyla önceden bildirilir; dönmeye başladıktan sonra verilen sinyal işe yaramaz."],
["T", 12, "Aksine bir işaret yoksa, eğimsiz iki yönlü dar yolda, otomobil ile otobüsün karşılaşması durumunda, hangisi diğerine yol vermelidir?", ["Otomobil, otobüse", "Otobüs, otomobile", "Şeridi daralmış olan, diğerine", "Azami ağırlığı az olan, diğerine"], 1, "Dar yolda ağır ve büyük araç, manevrası kolay olan küçük araca yol verir: otobüs otomobile yol verir. Eğimli yolda ise inen araç yol verir."],
["T", 12, "Çevre kirliliğini önlemek amacıyla yapılan çalışmalara ne denir?", ["Çevre", "Çevre hakkı", "Çevre koruma", "Çevre düzeni"], 2, "Çevreyi korumak ve kirliliği önlemek için yapılan çalışmaların tümüne çevre koruma denir."],
["T", 12, "Araçların muayene süresi dolmasa bile, aşağıdaki hâllerin hangisinden dolayı özel muayenesi zorunludur?", ["Sahibinin değişmesi hâlinde", "Motorun bakımdan geçirilmesi hâlinde", "Sürücüsü veya işleticisinin değişmesi hâlinde", "Kazaya karışması sonucunda yetkili görevli tarafından gerekli görülmesi hâlinde"], 3, "Kazada hasar gören aracın güvenli olup olmadığı yetkili gerek görürse özel muayeneyle kontrol edilir; sahip değişikliği muayene gerektirmez."],
["T", 12, "'İkiden fazla şeritli taşıt yollarında karşı yönden gelen trafiğin kullandığı şerit veya yol bölümüne girme' trafik kazalarında .................. sayılan hâllerdendir. Verilen ifadede noktalarla belirtilen yere aşağıdakilerden hangisi yazılmalıdır?", ["tali kusur", "asli kusur", "yol kusuru", "kusuru paylaştırma"], 1, "Karşı yönün şeridine girmek kanunda sayılan asli kusur hallerindendir; kazada sorumluluğun büyük kısmı bu sürücüdedir."],
["T", 12, "Bir kavşakta geçiş üstünlüğüne sahip aracın sesli ve ışıklı uyarısını alan sürücü nasıl hareket etmelidir?", ["Olduğu yerde hemen durmalı", "Derhal kavşağı boşaltarak yol vermeli", "Işıklı trafik işaretine uymalı", "Geriye dönerek beklemeli"], 1, "Sesli-ışıklı uyarı yapan ambulans, itfaiye veya polis aracına kavşak hemen boşaltılarak yol verilir."],
["T", 12, "Gündüzleri çekilen ve çeken araç arasındaki bağlantının uzunluğu kaç metreyi geçerse, üzerine kırmızı bez veya kırmızı yansıtıcı asılmalıdır?", ["1", "1,5", "2", "2,5"], 3, "Çekme bağlantısı 2,5 m'yi geçerse gündüz kırmızı bez veya yansıtıcı, gece kırmızı ışık asılır; bağlantı en fazla 5 m olabilir."],
["T", 12, "Işıklı trafik işaret cihazında kırmızı ile sarı ışığın birlikte yanması sürücüye neyi bildirir?", ["Yolda bakım çalışması olduğunu", "İleride hemzemin geçit bulunduğunu", "Yolun trafiğe açılmak üzere olduğunu", "Yolun trafiğe kapanmak üzere olduğunu"], 2, "Kırmızıyla birlikte sarı yanması yolun açılmak üzere olduğunu, yani yeşilin geleceğini bildirir; yeşil yanmadan hareket edilmez.", "isik"],
["T", 12, "Aralıklı yanıp sönen sarı ışık aşağıdaki levhalardan hangisi ile aynı anlamı taşır?", ["YOL VER levhası", "DUR levhası", "Sağdan daralan kaplama levhası", "Her iki taraftan daralan kaplama levhası"], 0, "Yanıp sönen sarı ışık 'yavaşla, dikkatle geç, gerekirse yol ver' demektir; yol ver levhasıyla aynı anlamdadır. Yanıp sönen kırmızı ise DUR levhasıdır."],
["T", 12, "Kırmızı çerçeveli daire içinde traktör çizimi bulunan levha neyi bildirir?", ["Traktörün geçebileceğini", "Traktörün giremeyeceğini", "Traktörlerin park edebileceğini", "Sadece traktörün girebileceğini"], 1, "Kırmızı çerçeveli daire içinde traktör çizimi o yola traktör giremeyeceğini bildirir."],
["T", 12, "Bir kavşakta, karşı yöndeki yolun girişinde 'girişi olmayan yol' levhası bulunuyor. Kavşağa gelen sürücünün aşağıdakilerden hangisini yapması yasaktır?", ["Sola dönüş yapması", "Sağa dönüş yapması", "Aynı yönde seyretmesi", "Kavşağa yaklaşırken hızını azaltması"], 2, "Karşıdaki yolun girişinde 'girişi olmayan yol' levhası varsa o yöne, yani düz devam etmek yasaktır; sağa veya sola dönülebilir."],
["T", 12, "Kamyon, kamyonet ve römorklarda yükle birlikte yolcu taşınırken aşağıdakilerden hangisinin yapılması yasaktır?", ["Yüklerin bağlanması", "Yolcuların yüklerin üzerine oturtulması", "Kasanın yan ve arka kapaklarının kapatılması", "Yolcuların kasa içinde ayrılmış bir yere oturtulması"], 1, "Yükle birlikte yolcu taşınırken yolcular yükün üzerine oturtulamaz; yük devrilir veya kayarsa yolcu yaralanır."],
["T", 12, "Trafik görevlisine, ışıklı trafik işaretlerine ve diğer işaretlere uymayan sürücülere aşağıdakilerden hangisi uygulanır?", ["Aracına el koyma", "Hafif hapis cezası", "Trafikten men etme", "Para cezası ve ceza puanı"], 3, "Görevliye, ışıklara ve işaretlere uymamak para cezası ve ceza puanı gerektirir."],
["T", 12, "I. Görülmelerinin engellenmesi\nII. Sorumlu kuruluşların eskiyenleri yenisi ile değiştirmesi\nIII. Üzerlerine yazı yazılması, çizilmesi, kırılması, delinmesi, sökülmesi.\nTrafik işaretleri ile ilgili olarak yukarıdaki davranışlardan hangilerinin yapılması yasaktır?", ["I ve II", "I ve III", "II ve III", "I, II ve III"], 1, "İşaretleri kapatmak, üzerine yazmak, kırmak veya sökmek yasaktır. Eskiyenleri yenilemek sorumlu kuruluşun görevidir."],
["M", 12, "Yanmış gazları, yanma odalarından egzoz borusuna aktaran motor parçası aşağıdakilerden hangisidir?", ["Karbüratör", "Emme supabı", "Egzoz manifoldu", "Emme manifoldu"], 2, "Egzoz manifoldu silindirlerden çıkan yanmış gazları toplayıp egzoz borusuna aktarır. Emme manifoldu ise havayı silindirlere taşır."],
["M", 12, "Hangisi silindir içinde sıkıştırılmış olan yakıt-hava karışımını elektrik kıvılcımı ile ateşler?", ["Buji", "Distribütör", "Ateşleme bobini", "Kontak anahtarı"], 0, "Benzinli motorda sıkıştırılmış karışımı bujinin çaktığı kıvılcım ateşler. Bobin gerilimi yükseltir, distribütör dağıtır."],
["M", 12, "Aşağıdakilerden hangisi motorda normal yanma olmamasının sebeplerindendir?", ["Far ayarının bozulması", "Hava filtresinin kirli olması", "Fren balatalarının aşınması", "Vantilatör kayışının sıkı olması"], 1, "Kirli hava filtresi motora yeterli hava girmesini engeller; karışım bozulur, yanma tam olmaz, yakıt tüketimi artar."],
["M", 12, "Motor soğutma suyu sıcaklığını sürücüye bildiren gösterge aşağıdakilerden hangisidir?", ["Şarj göstergesi", "Yakıt göstergesi", "Hararet göstergesi", "Fren hidroliği göstergesi"], 2, "Hararet (sıcaklık) göstergesi soğutma suyunun sıcaklığını gösterir; kırmızıya çıkarsa motor hararet yapıyordur."],
["M", 12, "Vites değiştirirken vites kutusundan ses geliyorsa sebebi aşağıdakilerden hangisi olabilir?", ["Kavramanın tam ayırmaması", "Gaz pedalına tam basılmaması", "Fren pedalına tam basılmaması", "Lastik hava basıncının düşük olması"], 0, "Kavrama tam ayırmazsa vites değiştirirken dişliler birbirine sürtünür ve ses yapar."],
["M", 12, "Aşağıdakilerden hangisi süspansiyon sisteminin elemanıdır?", ["Şaft", "Direksiyon", "Vites kutusu", "Helezon yaylar"], 3, "Helezon yaylar ve amortisörler süspansiyonun parçasıdır. Şaft ve vites kutusu güç aktarma, direksiyon ise yönlendirme sistemindendir."],
["M", 12, "Aşağıdakilerden hangisi klimanın kullanım amaçlarından biri değildir?", ["Yakıt tüketiminin azaltılması", "Araç içi nem oranının ayarlanması", "Hava sirkülasyonunun sağlanması", "Sıcaklığın istenilen değere ayarlanması"], 0, "Klima sıcaklığı, nemi ve hava dolaşımını ayarlar; yakıt tüketimini azaltmaz, tersine artırır."],
["M", 12, "Aşağıdakilerden hangisi motorun parçasıdır?", ["Aks", "Karter", "Rotil", "Şaft"], 1, "Karter motorun alt kısmındaki yağ haznesidir. Aks, rotil ve şaft güç aktarma ve yürüyen aksamın parçalarıdır."],
["M", 12, "Temiz kireçsiz su ile donmayı ve korozyonu önleyici antifriz karışımından oluşan sıvıya ne ad verilir?", ["Motor yağı", "Fren hidroliği", "Akü elektroliti", "Motor soğutma suyu"], 3, "Soğutma suyu, kireçsiz su ve antifriz karışımıdır. Akü elektroliti saf su ile sülfürik asittir."],
["M", 12, "Aracın elektrik devresinde, akım yüksek olduğunda eriyerek güvenliği sağlayan parça aşağıdakilerden hangisidir?", ["Akü", "Sigorta", "Platin", "Alternatör DENEME SINAVI 2 -"], 1, "Sigorta aşırı akımda eriyerek devreyi keser; kabloları ve cihazları yanmaktan korur."],
["I", 13, "Aşağıdakilerden hangisi trafik kazalarının önlenmesinde en önemli unsurdur?", ["Yolları ve kaldırımları onarmak", "Araçların bakım ve onarımını önemsemek", "Yağmurlu ve sisli havalarda daha dikkatli olmak", "Kurallara uymayı alışkanlık hâline getiren bireyler yetiştirmek"], 3, "Kazaların çoğu insan hatasından kaynaklandığı için kuralları alışkanlık haline getiren bireyler yetiştirmek en etkili önlemdir."],
["I", 13, "Yaralının araçtan çıkarılması esnasında en çok hangisine dikkat edilmelidir?", ["Yaralıda yeni bir yaralanma meydana gelmemesine", "Kazayı seyredenlerin uzaklaştırılmasına", "Kaza yapan araca hasar verilmemesine", "Hızlı ve aceleci davranmaya"], 0, "Yanlış çıkarma omurga gibi yaralanmaları ağırlaştırır; amaç yaralıya yeni bir zarar vermemektir."],
["I", 13, "Dinlenme hâlindeki sağlıklı yetişkin bir insan, ortalama olarak dakikada kaç defa nefes alıp verir?", ["5 - 10", "12 - 20", "25 - 30", "35 - 40"], 1, "Dinlenen sağlıklı yetişkin dakikada 12–20 kez nefes alır; nabız ise 60–100'dür."],
["I", 13, "Aşağıdakilerden hangisi şok belirtilerindendir?", ["Zihinsel aktivitenin artması", "Cildin soğuk ve nemli olması", "Vücut sıcaklığının hızla yükselmesi", "Dilin gevşeyerek geriye doğru toplanması"], 1, "Şokta dolaşım bozulur: cilt soğuk, soluk ve nemli olur, nabız hızlı ve zayıflar, bilinç bulanır."],
["I", 13, "Aşağıdakilerden hangisi açık yaralarda yapılabilecek genel ilk yardım uygulamalarındandır?", ["Yaralı bölgeyi kalp seviyesinden aşağıda tutmak", "Kanama varsa şoka karşı önlem almak", "Yaraya pamuk koyarak sarmak", "Yaraya merhem sürmek"], 1, "Açık yarada kanama durdurulur ve kan kaybına bağlı şoka karşı önlem alınır. Pamuk ve merhem kullanılmaz."],
["I", 13, "Köprücük kemiği kırıklarında yaralının hangi bölgesi tespit edilir?", ["El", "Kalça", "Omuz", "Göğüs"], 2, "Köprücük kemiği kırığında kol askıya alınarak omuz bölgesi sabitlenir."],
["I", 13, "Hangi durumdaki yaralı sağlık kuruluşuna taşınmada birinci derecede önceliklidir?", ["Turnike uygulanan", "Ayağında çıkık olan", "Solunum zorluğu çeken", "Birinci derecede yanığı olan"], 2, "Solunum zorluğu hayatı hemen tehdit eder, bu yüzden taşımada birinci önceliktir. Çıkık ve 1. derece yanık bekleyebilir."],
["I", 13, "Aşağıdakilerden hangisi gözlük veya lens kullanarak görme yeterliliğine sahip olan sürücüler için doğrudur?", ["Bu tür adaylara sürücü belgesi verilmez.", "Araç kullanırken gözlük veya lenslerini kullanmak zorundadırlar.", "Yalnızca şehir dışı yollarda gözlük veya lens kullanmak zorundadırlar.", "Yalnızca gece araç kullanırken gözlük veya lens kullanmak zorundadırlar."], 1, "Görme yeterliliğini gözlük veya lensle sağlayan sürücü, araç kullanırken bunları takmak zorundadır; bu durum belgeye işlenir."],
["I", 13, "Aşağıdakilerden hangisi ilk yardımın amaçlarından biri değildir?", ["İlaçla tedavi etmek", "Tıbbi yardım için iletişim kurmak", "Durumun kötüleşmesini engellemek", "Yaşamı korumak ve sürdürülmesini sağlamak"], 0, "İlk yardım ilaçsız uygulamadır. Amaç yaşamı korumak, durumun kötüleşmesini önlemek ve tıbbi yardım çağırmaktır."],
["I", 13, "Yaralıyı araçtan çıkarırken aşağıdakilerden hangisine dikkat edilmelidir?", ["Kollarının baş hizasında durmasına", "Baş tarafından çekilerek çıkarılmasına", "Ayak tarafından çekilerek çıkarılmasına", "Baş-boyun-gövde hizasının bozulmamasına"], 3, "Omurga yaralanması ihtimaline karşı baş-boyun-gövde aynı eksende tutulur; baştan veya ayaktan çekmek yasaktır."],
["I", 13, "Aşağıdaki kanama türlerinden hangisinde, kan kaybı diğerlerine nazaran fazla olduğu için daha kısa sürede hayati tehlike meydana gelir?", ["Burun kanamaları", "Atardamar kanamaları", "Kılcal damar kanamaları", "Toplardamar kanamaları"], 1, "Atardamarda kan basınçla fışkırır, kısa sürede çok kan kaybedilir; bu yüzden en tehlikeli kanama türüdür."],
["I", 13, "Uzun süreli kanamalardaki turnike uygulamalarında, kanayan bölgeye göre kaç dakikada bir boğucu sargı gevşetilmelidir?", ["1-2 dakika", "5-10 dakika", "15-20 dakika", "30-40 dakika"], 2, "Ehliyet müfredatına göre turnike ilk bir saat içinde 15–20 dakikada bir, birkaç saniye gevşetilir. Uzuv kopmasında ise hiç gevşetilmez."],
["I", 13, "Diz ile ayak arasındaki kemik kırıklarında dıştan uygulanacak olan atelin boyu ne kadar olmalıdır?", ["Topuktan dize kadar", "Dizden kalçaya kadar", "Topuktan kalçaya kadar", "Topuktan koltuk altına kadar"], 2, "Diz ile ayak arasındaki kırıkta bir üst (diz) ve bir alt (ayak bileği) eklem de sabitlenmelidir; atel topuktan kalçaya kadar uzanır."],
["T", 13, "Trafik görevlisi geceleyin ışıklı işaret çubuğunu başının üzerinden bir yandan diğer yana yay çizecek şekilde sallıyorsa bu işaretin sürücüler için anlamı nedir?", ["Hızlandırma işareti", "Yavaşlatma işareti", "Geç işareti", "Dur işareti"], 3, "Geceleyin görevli ışıklı çubuğu başının üzerinden yay çizerek sallarsa bu, gündüzki el kaldırma gibi DUR anlamına gelir; bütün sürücüler durur."],
["T", 13, "Üçgen içinde %10 iniş eğimi çizimi bulunan levhayı gören sürücünün aşağıdakilerden hangisini yapması doğrudur?", ["Hızını artırması", "Sert fren yapması", "Vitesi boşa alması", "Uygun vitesle inmesi"], 3, "Tehlikeli inişte frene sürekli basmak frenleri ısıtıp tutmaz hale getirir; uygun küçük vitesle inilip motor freni kullanılır."],
["T", 13, "Şekildeki trafik işareti sürücüye neyi bildirir?", ["Azami hız sınırını", "Geçme yasağı sonunu", "Taşıtın giremeyeceğini", "Hız sınırlaması sonunu"], 0, "Kırmızı çerçeveli daire içinde 50: bu yolda azami hız 50 km/saattir.", "hiz50"],
["T", 13, "Bir kavşakta 3 numaralı aracın gitmek istediği yolun girişinde 'taşıt trafiğine kapalı yol' levhası bulunuyor. Hangi numaralı taşıtın ok yönündeki hareketi yasaktır?", ["1", "2", "3", "4"], 2, "Taşıt trafiğine kapalı yola hiçbir taşıt giremez; o yöne gitmek isteyen 3 numaralı aracın hareketi yasaktır."],
["T", 13, "Banketli bir yoldan geceleyin yürümek isteyen yayanın aşağıdakilerden hangisini yapması yanlıştır?", ["Açık renkte elbise giymesi", "Kendi gidiş yönüne göre sağ bankette yürümesi", "Kendi gidiş yönüne göre sol bankette yürümesi", "El fenerini sürücülerin dikkatini dağıtmadan kullanması"], 1, "Yaya, karşıdan gelen araçları görebilmek için gidiş yönüne göre sol bankette yürür; sağ bankette yürümek yanlıştır."],
["T", 13, "I. Çekme halatı\nII. Pense, tornavida\nIII. Kriko, bijon anahtarı\nIV. Bir çift patinaj zinciri.\nYukarıdaki malzeme ve takımlardan hangilerinin otomobillerde bulundurulması zorunludur?", ["I ve II", "I, II ve III", "II, III ve IV", "I, II, III ve IV"], 3, "Otomobilde çekme halatı, pense-tornavida, kriko-bijon anahtarı ve bir çift patinaj zinciri dahil bu malzemelerin hepsi zorunludur."],
["T", 13, "Trafik kazalarında olay yerine ışıklı işaret veya yansıtıcı koymanın amacı nedir?", ["Yardım istemek", "Çok sayıda yaralının olduğunu bildirmek", "Diğer sürücülerin dikkatini çekerek uyarmak", "Kazanın sadece maddi hasarlı olduğunu bildirmek"], 2, "Işıklı işaret ve reflektör, kaza yerine yaklaşan sürücüleri önceden uyararak zincirleme kazaları önler."],
["T", 13, "Şekildeki trafik işaretinin anlamı nedir?", ["Açılan köprü", "Sola tehlikeli viraj", "Soldan daralan kaplama", "Sola tehlikeli devamlı viraj"], 1, "Üçgen içinde sola kıvrılan ok sola tehlikeli virajı bildirir; viraja girmeden hız azaltılır.", "solviraj"],
["T", 13, "Aşağıdaki levhalardan hangisi trafik tanzim işaretleri grubunda yer alır?", ["Karşıdan gelene yol ver", "Sağdan daralan kaplama", "Yolda çalışma", "Tehlikeli devamlı virajlar"], 0, "Trafik tanzim işaretleri yasaklama, kısıtlama ve mecburiyet bildirir. 'Karşıdan gelene yol ver' bir tanzim işaretidir; diğerleri tehlike uyarı işaretidir."],
["T", 13, "Ticari amaçla şehirler arası yolda yük ve yolcu taşımacılığı yapan araç şoförleri, 24 saatlik süre içinde devamlı olarak en fazla kaç saat araç kullanabilirler?", ["2,5", "3,5", "4,5", "5,5"], 2, "Ticari yük ve yolcu taşıyan şoförler 24 saatte devamlı olarak en fazla 4,5 saat araç kullanabilir, sonra mola verir."],
["T", 13, "Kara yollarında araçların seyretmelerine izin verilen en üst hız sınırına ne denir?", ["Azami hız", "Seyir hızı", "Asgari hız", "Uygun hız"], 0, "Bir yolda izin verilen en yüksek hız azami hızdır; en düşük hız ise asgari hızdır."],
["T", 13, "1. Geçiş şeridinde yeteri kadar ilerlemek\n2. Sola dönüş lambası ile işaret vermek\n3. Takip mesafesi kadar önceden sol şeride geçmek\n4. Sağa dönüş lambası ile işaret vermek.\nAraç geçme ile ilgili yukarıda verilen kurallar hangi sıra ile uygulanmalıdır?", ["1 - 2 - 3 - 4", "2 - 1 - 3 - 4", "2 - 3 - 1 - 4", "3 - 4 - 1 - 2"], 2, "Önce sola sinyal verilir, takip mesafesi kadar geriden sol şeride geçilir, geçilen araçtan yeterince uzaklaşılır, sonra sağa sinyal verip sağ şeride dönülür."],
["T", 13, "Tehlikeli eğimli yollarda karşılaşma hâlinde; çıkan aracın geçişi zorsa, inen aracın sürücüsü ne yapmalıdır?", ["Varsa sığınma cebine girmeli, yoksa sağa yanaşıp durmalı", "Çıkan aracın sürücüsünü ikaz ederek yavaşlatmalı", "Motoru durdurup, vitesi boşa alıp inmeli", "Çıkan aracın geri gitmesini sağlamalı"], 0, "Eğimli dar yolda inen araç yol verir: varsa sığınma cebine girer, yoksa sağa yanaşıp durur, gerekirse geri gider."],
["T", 13, "Geceleyin önündeki aracı geçmek isteyen sürücü, bu araçla yan yana gelinceye kadar hangi ışıkları kullanmalıdır?", ["Sis ışıklarını", "Acil uyarı ışıklarını", "Uzağı gösteren ışıkları", "Yakını gösteren ışıkları"], 3, "Geçme sırasında öndeki aracın sürücüsünü kamaştırmamak için yanına gelene kadar kısa far kullanılır."],
["T", 13, "B sınıfı sürücü belgesine sahip olan Mehmet, A2 sınıfı sürücü belgesi almak için başvuru yapıyor. Mehmet aşağıdaki araçlardan hangisini kullanmak istemektedir?", ["Kamyon", "Minibüs", "Traktör", "Motosiklet"], 3, "A2 sınıfı belge motosiklet içindir (35 kW'a kadar). Kamyon C, minibüs D1, traktör F sınıfıdır."],
["T", 13, "Aşağıdakilerden hangisi çevreye duyarlı bir davranış değildir?", ["Sigara külü ve izmaritlerinin veya başka şeylerin yola atılıp dökülmesi", "Bir yere giderken toplu taşıma araçlarının kullanılması", "Trafiğin yoğun olduğu saatlerde trafiğe çıkılmaması", "Sürücünün en kısa ve en uygun yolu kullanması"], 0, "Yola izmarit ve çöp atmak çevreyi kirletir ve yangına yol açabilir. Diğer üç davranış çevreye duyarlıdır."],
["T", 13, "Aşağıdaki tehlike uyarı levhalarından hangisi sağa tehlikeli devamlı virajları bildirir?", ["İlk kıvrımı sola olan zikzak ok", "Sağa kıvrılan tek ok", "İlk kıvrımı sağa olan zikzak ok", "Sağ taraftan daralan çizgiler"], 2, "İlk kıvrımı sağa olan zikzak ok, sağa tehlikeli devamlı virajları bildirir."],
["T", 13, "İki yönlü bir yolda, devamlı çizginin bulunduğu tarafta seyreden 3 numaralı araç çizgiyi geçerek öndeki aracı sollamıştır. Hangi numaralı aracın sürücüsü hatalıdır?", ["1", "2", "3", "4"], 2, "Devamlı çizgi geçme yasağı bildirir; bu çizgiyi geçerek sollama yapan 3 numaralı araç hatalıdır."],
["T", 13, "Kontrolsüz kavşaklarda aşağıdakilerden hangisinin yapılması doğrudur?", ["Şerit değiştirilmesi", "Öndeki aracın geçilmesi", "Aracın hızının artırılması", "Geçiş hakkı kuralına uyulması"], 3, "Işık, levha veya görevli olmayan kavşakta geçiş hakkı kurallarına uyulur; geçme, şerit değiştirme ve hızlanma yapılmaz."],
["T", 13, "Arkadan çarpma şeklindeki trafik kazalarının en önemli sebebi aşağıdakilerden hangisidir?", ["Öndeki aracın durması", "Öndeki aracın yavaşlaması", "Görüş mesafesinin kötü olması", "Takip mesafesi kurallarına uyulmaması"], 3, "Öndeki araç her an durabilir. Yeterli takip mesafesi bırakan sürücü zamanında durur; arkadan çarpmanın asıl nedeni yakın takiptir."],
["T", 13, "I. Sürücü belgesi\nII. Araç tescil belgesi\nIII. Motorlu araç trafik belgesi\nIV. Zorunlu mali sorumluluk sigortası.\nYukarıdakilerden hangileri, trafik denetiminde istenmesi hâlinde sürücünün göstermek zorunda olduğu belgelerdendir?", ["Yalnız I", "I ve II", "III ve IV", "I, II, III ve IV"], 3, "Denetimde sürücü belgesi, tescil belgesi (ruhsat), trafik belgesi ve zorunlu trafik sigortası poliçesi istenebilir."],
["T", 13, "Şekildeki tehlike uyarı levhası aşağıdakilerden hangisine yaklaşıldığını bildirir?", ["Okul geçidine", "Yürüyüş yoluna", "Yaya yolu sonuna", "Çocuk bahçesine"], 0, "Çantalı iki öğrenci çizimi okul geçidini gösterir. Okul taşıtları ve çocuklar için yavaşlanır, gerekirse durulur.", "okul"],
["T", 13, "Işıklı trafik işaret cihazında, hangisinin yanması yolun trafiğe kapanmak üzere olduğunu bildirir?", ["Aralıklı yanıp sönen sarı ışık", "Aralıklı yanıp sönen kırmızı ışık", "Yeşil ışıktan sonra yanan sarı ışık", "Kırmızı ışıkla birlikte yanan sarı ışık"], 2, "Yeşilden sonra yanan sarı ışık yolun kapanmak üzere olduğunu bildirir; güvenle durulabiliyorsa durulur."],
["T", 13, "Öndeki aracı geçme ile ilgili aşağıdaki ifadelerden hangisi doğrudur?", ["Geçilecek aracın hızı dikkate alınmalıdır.", "Geçme sırasında banketlerden yararlanılmalıdır.", "Şerit değiştirmeye başlamadan önce öndeki araca iyice yaklaşılmalıdır.", "Karşı yöne ayrılmış şerit dolu ise öndeki araç uyarılarak sağdan geçilmelidir."], 0, "Geçmeden önce öndeki aracın hızı ve aradaki mesafe hesaplanır. Banketten veya sağdan geçmek yasaktır."],
["T", 13, "I. İlk yardım tedbirlerini almak\nII. Olayı en yakın zabıta veya sağlık kuruluşuna bildirmek\nIII. Yetkililerin isteği hâlinde yaralıları en yakın sağlık kuruluşuna götürmek.\nTrafik kazasına karışan veya olay yerinden geçenler, yukarıda verilenlerden hangilerini yapmakla yükümlüdür?", ["Yalnız I", "I ve II", "II ve III", "I, II ve III"], 3, "Kazaya karışanlar ve olay yerinden geçenler ilk yardım yapar, olayı bildirir ve istenirse yaralıları sağlık kuruluşuna götürür."],
["T", 13, "Sürücülerin taşıt yolunun sol şeridinde aşağıdakilerden hangisini yapması yasaktır?", ["Yavaşlaması", "Vites küçültmesi", "Yolcu indirip bindirmesi", "Uygun hızla seyretmesi"], 2, "Sol şeritte durup yolcu indirip bindirmek yasaktır; yolcu araçların arasına iner."],
["T", 13, "Sağa tehlikeli devamlı viraj levhası görülünce ne yapılır?", ["Hız sabit tutulur.", "Hız azaltılır, sola sinyal verilir.", "Hız artırılır, sağa sinyal verilir.", "Hız azaltılır, varsa geçme yasağına uyulur."], 3, "Devamlı viraj levhasında hız azaltılır ve geçme yasağı varsa uyulur."],
["M", 13, "Seyir hâlindeyken araçtan yanık kablo kokusu alınırsa aşağıdakilerden hangisi yapılır?", ["Yakıt seviyesi kontrol edilir.", "Önemsenmez, devam edilir.", "Lastiklerin hava basıncı kontrol edilir.", "Durulur, kontak kapatılır ve akü bağlantısı çıkarılır."], 3, "Yanık kablo kokusu kısa devre ve yangın belirtisidir; durulur, kontak kapatılır ve akü bağlantısı sökülür."],
["M", 13, "Seyir hâlindeki aracın gösterge panelinde aşağıdaki ikaz ışıklarından hangisinin yanması, trafik kurallarına uymak şartıyla derhâl durulmasını gerektirir?", ["Park lambası", "Kısa farlar", "Arka sis lambası", "Hararet ikaz ışığı"], 3, "Hararet ışığı yanarken devam edilirse motor ciddi hasar görür; güvenli yerde hemen durulur."],
["M", 13, "Güç aktarma sırası şöyledir: motor → vites kutusu → şaft → ? → akslar ve tekerlekler. Soru işaretiyle gösterilen organın adı nedir?", ["Volan", "Kavrama", "Diferansiyel", "Vites kutusu"], 2, "Güç motordan vites kutusuna, şafttan diferansiyele, oradan akslarla tekerleklere gider; soru işaretli parça diferansiyeldir."],
["M", 13, "Araçların güvenli bir şekilde yavaşlamasını, durmasını ve sabitlenmesini sağlayan sistem aşağıdakilerden hangisidir?", ["Süspansiyon sistemi", "Ateşleme sistemi", "Marş sistemi", "Fren sistemi"], 3, "Fren sistemi aracın yavaşlamasını, durmasını ve durduğu yerde kalmasını (el freni) sağlar."],
["M", 13, "Süspansiyon sisteminde bulunan ve yay salınım süresini kısaltan parça aşağıdakilerden hangisidir?", ["Aks", "Şaft", "Amortisör", "Rotil"], 2, "Amortisör yayların salınımını sönümler; araç zıplamaz, yol tutuşu artar."],
["M", 13, "Aşağıdakilerden hangisi araçlarda egzoz gaz emisyonlarını azaltmak için kullanılır?", ["Egzoz supabı", "Emme manifoldu", "Egzoz manifoldu", "Katalitik konvertör"], 3, "Katalitik konvertör egzozdaki zehirli gazları daha az zararlı gazlara dönüştürür."],
["M", 13, "Aküden gelen düşük gerilimi, buji tırnakları arasında kıvılcım oluşturacak şekilde yüksek gerilime dönüştüren ateşleme sistemi elemanına ne ad verilir?", ["Sigorta", "Konjektör", "Kontak anahtarı", "Endüksiyon bobini"], 3, "Endüksiyon (ateşleme) bobini 12 voltu binlerce volta yükseltir; konjektör (distribütör) bu akımı sırayla bujilere dağıtır."],
["M", 13, "Aşağıdakilerden hangisi akünün kendiliğinden boşalmasına neden olur?", ["Kutup başlarının sıkı olması", "Kutup başlarının temiz olması", "Akü etiketinin yırtılması", "Üst kısmında pisliklerin birikmesi"], 3, "Akünün üstündeki kir ve nem kutuplar arasında kaçak akım yolu oluşturur; akü kullanılmasa da boşalır."],
["M", 13, "Temiz kireçsiz su ile donmayı ve korozyonu önleyici antifriz karışımından oluşan sıvıya ne ad verilir?", ["Motor yağı", "Fren hidroliği", "Akü elektroliti", "Motor soğutma suyu"], 3, "Soğutma suyu, kireçsiz su ve antifriz karışımıdır. Akü elektroliti saf su ile sülfürik asittir."],
["M", 13, "Şarj sisteminin gerilimini sınırlandıran parça aşağıdakilerden hangisidir?", ["Sigorta", "Regülatör", "Karbüratör", "Marş motoru DENEME SINAVI 3 -"], 1, "Regülatör şarj sisteminin gerilimini sınırlar; aküyü aşırı şarjdan korur."],
["I", 14, "Kazazedenin dolaşımı değerlendirilirken;\nI. Bebeklerde kol atardamarından,\nII. Çocuk ve yetişkinlerde şah damarından nabız alınır.\nVerilenler için aşağıdakilerden hangisi söylenebilir?", ["I. doğru, II. yanlış", "I. yanlış, II. doğru", "Her ikisi de doğru", "Her ikisi de yanlış"], 2, "Bebeğin boynu kısa olduğu için nabız kolun iç yüzündeki atardamardan, çocuk ve yetişkinde boyundaki şah damarından alınır."],
["I", 14, "Yaralının araçtan çıkarılması esnasında en çok hangisine dikkat edilmelidir?", ["Yaralıda yeni bir yaralanma meydana gelmemesine", "Kazayı seyredenlerin uzaklaştırılmasına", "Kaza yapan araca hasar verilmemesine", "Hızlı ve aceleci davranmaya"], 0, "Yanlış çıkarma omurga gibi yaralanmaları ağırlaştırır; amaç yaralıya yeni bir zarar vermemektir."],
["I", 14, "Köprücük kemiği kırıklarında kazazede hangi pozisyonda hastaneye sevk edilir?", ["Oturuş", "Yan yatış", "Sırtüstü yatış", "Yüzüstü yatış"], 0, "Köprücük kemiği kırığında kol askıya alınır ve yaralı oturur pozisyonda taşınır."],
["I", 14, "Aşağıdakilerden hangisi toplardamar kanamasının özelliğidir?", ["Açık parlak kırmızı renkte olması", "Koyu kırmızı renkli ve yayılarak (taşma tarzında) akması", "Kalp atımları ile uyumlu ve fışkırır tarzda olması", "Küçük kabarcıklar yaparak, sızıntı şeklinde akması"], 1, "Toplardamar kanı oksijeni azaldığı için koyu kırmızıdır ve basıncı düşük olduğundan taşarak akar."],
["I", 14, "Burkulan eklem bölgesinin şişmesini önlemek için yapılması gereken uygulama aşağıdakilerden hangisidir?", ["Kişinin yan yatış pozisyonuna alınması", "Burkulan bölgenin sürekli hareket ettirilmesi", "Burkulan bölgenin kalp seviyesinden yukarıda ve soğuk tutulması", "Burkulan bölgenin kalp seviyesinden aşağıda ve sıcak tutulması"], 2, "Bölgeyi kalp seviyesinin üstünde tutmak ve soğuk uygulamak şişliği azaltır. Sıcak uygulama ve hareket şişliği artırır."],
["I", 14, "Sıcak çarpması sonucu oluşan bitkinliğin esas sebebi aşağıdaki durumlardan hangisidir?", ["Nabız sayısının azalması", "Kan dolaşımının yavaşlaması", "Sindirim sisteminin çalışmaması", "Terleme sonucu aşırı su ve tuz kaybı olması"], 3, "Sıcak çarpmasında aşırı terlemeyle vücut çok fazla su ve tuz kaybeder; bitkinliğin nedeni budur."],
["I", 14, "Aşağıdakilerden hangisi, göz muayenesine ilişkin esaslara göre 'renk körlüğü' olan sürücü adayları ve sürücüler için doğrudur?", ["Herhangi bir koşul aranmadan sürücü olabilirler.", "Bu tür adaylara sürücü belgesi verilmez.", "Araç kullanırken gözlük veya lens takmak zorundadırlar.", "Yalnızca gece araç kullanmaları koşuluyla sürücü belgesi verilir."], 0, "Göz muayenesi esaslarına göre renk körlüğü sürücü olmaya engel değildir; ışıklar konum ve şekilden de ayırt edilebilir."],
["I", 14, "I. Yaşamı korumak,\nII. Durumun kötüye gitmesini önlemek,\nIII. İyileşmeyi kolaylaştırmak.\nYukarıda verilenlerden hangileri ilk yardımın amaçlarındandır?", ["Yalnız I", "I ve II", "II ve III", "I, II ve III"], 3, "İlk yardımın amaçları yaşamı korumak, durumun kötüleşmesini önlemek ve iyileşmeyi kolaylaştırmaktır."],
["I", 14, "Aşağıdakilerden hangisinin ilk yardım çantasında bulundurulması zorunludur?", ["Oksijenli su", "Gazlı bez", "Kâğıt mendil", "Ağrı kesici ilaç"], 1, "Gazlı bez ilk yardım çantasının zorunlu malzemesidir. İlk yardımda ilaç kullanılmaz."],
["I", 14, "Omurga kırıklarında geçici veya kalıcı felçlerin oluşmasının nedeni aşağıdakilerden hangisidir?", ["Sırtüstü, düz pozisyonda yatırılması", "Kazazedenin hareketsiz hâle getirilmesi", "Omuriliğin baskı altında olması ya da zedelenmesi", "Taşıma esnasında baş, boyun ve gövde ekseninin korunması"], 2, "Felci omuriliğin ezilmesi veya zedelenmesi yapar; diğer şıklar omurgayı korumak için yapılan doğru uygulamalardır."],
["I", 14, "Suda boğulan kalp ve solunumu durmuş bir yetişkine, ilk yardım yapan kişi tek başına ise aşağıdakilerden hangisini uyguladıktan sonra tıbbi yardım istemelidir?", ["30 kalp masajı, 2 suni solunumu 5 tur uyguladıktan sonra", "60 kalp masajı, 1 suni solunumu 5 tur uyguladıktan sonra", "30 kalp masajı, 2 suni solunum uygulamasının hemen sonrası", "60 kalp masajı, 2 suni solunum uygulamasının hemen sonrası"], 0, "Boğulmada sorun oksijensizliktir; yalnız ilk yardımcı önce 5 tur (30:2) temel yaşam desteği yapar, sonra yardım çağırır."],
["I", 14, "Diz ile ayak arasındaki kemik kırıklarında dıştan uygulanacak olan atelin boyu ne kadar olmalıdır?", ["Topuktan dize kadar", "Dizden kalçaya kadar", "Topuktan kalçaya kadar", "Topuktan koltuk altına kadar"], 2, "Diz ile ayak arasındaki kırıkta bir üst (diz) ve bir alt (ayak bileği) eklem de sabitlenmelidir; atel topuktan kalçaya kadar uzanır."],
["I", 14, "Kaza yerinde bulunan ilk yardımcı, acil sağlık yardımı için aşağıdaki telefon numaralarından hangisini aramalıdır?", ["156", "155", "112", "110"], 2, "Acil sağlık yardımı için 112 aranır; 155 polis, 156 jandarma, 110 itfaiyeydi (bunlar da artık 112'de birleşti)."],
["T", 14, "Aşağıdaki tehlike uyarı levhalarından hangisi sağa tehlikeli devamlı virajları bildirir?", ["İlk kıvrımı sağa olan zikzak ok", "Sağa kıvrılan tek ok", "İlk kıvrımı sola olan zikzak ok", "Sağ taraftan daralan çizgiler"], 0, "İlk kıvrımı sağa olan zikzak ok sağa tehlikeli devamlı virajları bildirir; tek kıvrımlı ok tek virajdır."],
["T", 14, "Şekildeki levha ne anlama gelir?", ["Öndeki taşıtı geçmek yasaktır", "U dönüşü yapmak yasaktır", "Motorlu taşıt trafiğine kapalı yol", "Kamyonlar için geçme yasağı sonu"], 0, "Yan yana kırmızı ve siyah otomobil çizimi öndeki taşıtı geçme yasağıdır; kırmızı olan geçmek isteyen taraftır.", "gecmeyasak"],
["T", 14, "2 numaralı araç öndeki aracı geçmeye başlamışken, arkasındaki 3 numaralı araç da geçmek için 2 numaralının önüne çıkıyor. Hangi numaralı aracın sürücüsü hatalıdır?", ["1", "2", "3", "4"], 2, "Arkadan gelen araç geçmeye başlamışken onun önüne çıkıp geçmeye kalkmak yasaktır; 3 numaralı araç hatalıdır."],
["T", 14, "Aşağıdakilerden hangisi çevre kirliliğini önleme açısından olumlu bir davranıştır?", ["İniş eğimli yollarda motorun durdurulması", "Bakım sırasında çıkan eski parça ve malzemelerin çevreye bilinçsizce bırakılmaması", "Taşıtlarda kalitesiz yakıtların kullanılması", "Taşıtlardan dışarıya malzeme atılması"], 1, "Bakımda çıkan eski parça, yağ ve lastiklerin çevreye bilinçsizce bırakılmaması çevreyi korur."],
["T", 14, "Kontrolsüz kavşaklarda aşağıdakilerden hangisinin yapılması doğrudur?", ["Şerit değiştirilmesi", "Öndeki aracın geçilmesi", "Aracın hızının artırılması", "Geçiş hakkı kuralına uyulması"], 3, "Işık, levha veya görevli olmayan kavşakta geçiş hakkı kurallarına uyulur; geçme, şerit değiştirme ve hızlanma yapılmaz."],
["T", 14, "Üçgen içinde tekerlekten sıçrayan taş çizimi bulunan levhayı (gevşek malzemeli zemin) gören sürücü aşağıdakilerden hangisini yapmalıdır?", ["Banketten gitmeli", "Takip mesafesini artırmalı", "Hızını artırarak öndeki aracı geçmeli", "Acil uyarı ışıklarını yakarak seyretmeli"], 1, "Gevşek malzemeli yolda tekerlekler taş sıçratır; takip mesafesi artırılır ve hız azaltılır."],
["T", 14, "Yaya geçidi levhasını gören sürücünün aşağıdakilerden hangisini yapması yanlıştır?", ["Yolu kontrol etmesi", "Aracının hızını azaltması", "Yayaları ikaz ederek geçmesi", "Geçiş hakkını yayalara vermesi"], 2, "Yaya geçidi levhasını gören sürücü yavaşlar ve yayaya yol verir; korna çalıp yayayı uyararak geçmek yanlıştır.", "yayagecidi"],
["T", 14, "Bir kara yolunda yan yana çizilmiş kesik ve devamlı yol çizgileri sürücülere neyi bildirir?", ["Çift yönlü yoldan tek yönlü yola girileceğini", "Her iki yöndeki araçların bölünmüş yola gireceğini", "Her iki yöndeki araçların hiçbir şekilde şerit değiştiremeyeceğini", "Kesik çizgi tarafındaki araçların geçiş yapabileceğini, devamlı çizgi tarafındakilerin yapamayacağını"], 3, "Her sürücü kendi tarafındaki çizgiye uyar: kesik çizgi tarafındaki güvenli olunca geçebilir, devamlı çizgi tarafındaki geçemez."],
["T", 14, "I. İdari para cezası verilir.\nII. Sürücü belgesi 6 ay süre ile geri alınır.\nIII. Kara yolunda araç sürmesine izin verilir.\nYapılan ölçüm sonucunda, yasal sınırların üzerinde alkollü olarak araç kullandığı birinci defa tespit edilen sürücüye yukarıdaki işlemlerden hangileri uygulanır?", ["Yalnız I", "I ve II", "II ve III", "I, II ve III"], 1, "Hususi otomobilde 0,50 promili ilk kez aşan sürücüye para cezası verilir ve belgesi 6 ay geri alınır; o gün araç kullandırılmaz."],
["T", 14, "Yeterince aydınlatılmamış bir tünele giren aracın sürücüsü aşağıdakilerden hangisini yapmak zorundadır?", ["Duraklamak", "Araç içi ışıkları yakmak", "Uzağı gösteren ışıkları yakmak", "Sadece park veya sis ışıklarını yakmak"], 2, "Yeterince aydınlatılmamış tünelde görüş için uzağı gösteren ışıklar yakılır; karşıdan araç gelince kısa fara geçilir."],
["T", 14, "Ambulans, itfaiye aracı, polis aracı ve iş makinesi görev hâlindeyken bir kavşakta karşılaşırsa ilk geçiş hakkını hangisi kullanır?", ["İş makinesi", "Polis aracı", "Ambulans", "İtfaiye aracı"], 2, "Öncelik sırası: ambulans (ve organ nakil aracı), itfaiye, polis. Sarı tepe lambalı iş makinelerinin ve kurtarıcıların geçiş üstünlüğü yoktur."],
["T", 14, "Trafik kazasına karışan kişilerin tümü, yetkililerin gelmesini gerekli görmez ve anlaşırlarsa, durumu aralarında yazılı olarak tespit etmek suretiyle olay yerinden ayrılabilirler. Yukarıdaki ifade hangi tür kazalarda geçerlidir?", ["Ölümlü kazalarda", "Yaralanmalı kazalarda", "Maddi hasarlı kazalarda", "Maddi hasarlı ve yaralanmalı kazalarda"], 2, "Sadece maddi hasarlı kazada taraflar anlaşırsa tutanakla olay yerinden ayrılabilir. Yaralı veya ölü varsa olay yeri terk edilmez."],
["T", 14, "Aşağıdakilerden hangisi çevreye duyarlı bir davranış değildir?", ["Sürücünün en kısa ve en uygun yolu kullanması", "Trafiğin yoğun olduğu saatlerde trafiğe çıkılmaması", "Bir yere giderken toplu taşıma araçlarının kullanılması", "Sigara külü ve izmaritlerinin veya başka şeylerin yola atılıp dökülmesi"], 3, "Yola izmarit ve çöp atmak çevreyi kirletir ve yangına yol açabilir. Diğer üç davranış çevreye duyarlıdır."],
["T", 14, "Kavşaklara yaklaşırken şeritlerin üzerine çizilmiş yön okları sürücülere neyi bildirir?", ["Durma, duraklama ve park etmenin yasaklanmış olduğunu", "Seyir yönüne uygun şeridin kullanılması gerektiğini", "Sağa ve sola dönülemeyeceğini", "Hızın artırılması gerektiğini"], 1, "Kavşak öncesi şeritlere çizilen oklar, gidilecek yöne uygun şeridin seçilmesi gerektiğini bildirir."],
["T", 14, "Üçgen içinde yüzde (%) yazan ve aşağı doğru eğim çizimi bulunan levha neyi bildirir?", ["Kaygan yola yaklaşıldığını", "Kara yolunun deniz kıyısında bittiğini", "Tehlikeli iniş eğimli bir kesime yaklaşıldığını", "Taşıt yoluna taş, kaya veya toprak düşebileceğini"], 2, "Üçgen içinde yüzde yazan eğim çizimi tehlikeli iniş eğimini bildirir; uygun küçük vitesle inilir."],
["T", 14, "Aşağıdaki trafik işaretlerinden hangisi tali yolda bulunur?", ["Ana yol – tali yol kavşağı levhası", "Tali yolun ana yola soldan katılması levhası", "Sağdan tali yol kavşağı levhası", "DUR levhası"], 3, "İlk üç levha ana yoldaki sürücüyü yaklaşan kavşağa karşı uyarır. DUR levhası tali yoldan ana yola çıkan sürücü içindir."],
["T", 14, "Kaza yapan aracın ön ve arkasına, diğer araç sürücülerini yavaşlatmak ve olası bir kaza tehlikesini önlemek için aşağıdakilerden hangisi yerleştirilmelidir?", ["Yangın tüpü", "Üçgen reflektör", "Beyaz renkte taş", "Teneke veya bidon gibi malzemeler"], 1, "Kaza yerinin önüne ve arkasına konan üçgen reflektör diğer sürücüleri uyarıp yavaşlatır."],
["T", 14, "I. Traktörler\nII. Otomobiller\nIII. Motorlu bisiklet ve motosikletler\nIV. Şehirler arası yolcu taşıyan otobüsler.\nYukarıda verilen araçların hangilerinde, ilk yardım çantası bulundurulması zorunludur?", ["I ve II", "II ve III", "II ve IV", "III ve IV"], 2, "İlk yardım çantası otomobillerde ve yolcu taşıyan otobüslerde zorunludur; traktör ve motosikletlerde zorunlu değildir."],
["T", 14, "2918 sayılı Karayolları Trafik Kanunu'nda belirtilen motorlu araçların sürülmesine yetki veren belge, aşağıdakilerden hangisidir?", ["Sürücü belgesi", "Araç imalat belgesi", "Kaza tespit tutanağı", "Motorlu taşıt sürücü sertifikası"], 0, "Motorlu araç kullanma yetkisini sürücü belgesi verir."],
["T", 14, "Aşağıdakilerden hangisi, tescil işlemleri tamamlanmış araçların trafiğe çıkarılmasına müsaade eden ve muayene sürelerini belirleyen bir belgedir?", ["Sürücü belgesi", "Araç imalat belgesi", "Mali sorumluluk sigortası", "Motorlu araç trafik belgesi"], 3, "Motorlu araç trafik belgesi tescilli aracın trafiğe çıkmasına izin verir ve muayene tarihlerini gösterir."],
["T", 14, "Aşağıdakilerden hangisi trafik ortamında riskli davranış olarak değerlendirilmez?", ["Aşırı hız yapmak", "Alkollü olarak araç kullanmak", "Emniyet kemeri takılıyken araç kullanmak", "Elinde cep telefonu varken araç kullanmak"], 2, "Emniyet kemeri takmak güvenli bir davranıştır; aşırı hız, alkol ve telefon risklidir."],
["T", 14, "• Doğrultu değiştirme manevralarını yanlış yapmak\n• Önde giden bir aracı güvenli ve yeterli mesafeden izlememek\nYukarıdakiler, trafik kazalarında rol oynayan faktörlerin hangisinin içinde değerlendirilir?", ["Araç kusurları", "Yaya kusurları", "Yolcu kusurları", "Sürücü kusurları"], 3, "İkisi de direksiyondaki kişinin hatasıdır. Kazalarda en büyük pay sürücü kusurlarınındır."],
["T", 14, "Motorlu bisiklet, motosiklet ve sürücüleri ile ilgili olarak aşağıdakilerden hangisinin yapılması yasaktır?", ["Gidiş yönüne göre yolun en sağından seyredilmesi", "İkiden fazlasının taşıt yolunun bir şeridinde yan yana sürülmesi", "Tehlikeli madde taşıyan araçların geçilmesi", "Geçme yaparken sinyal verilmesi"], 1, "Bir şeritte en fazla iki motosiklet yan yana gidebilir; daha fazlası diğer trafiği tehlikeye sokar."],
["T", 14, "Araçların muayene süresi dolmasa bile, aşağıdaki hâllerin hangisinden dolayı özel muayenesi zorunludur?", ["Kazaya karışması sonucu yetkili görevli tarafından gerekli görüldüğünde", "Sürücüsü veya işleteni değiştiğinde", "Motoru bakımdan geçirildiğinde", "Sahibi değiştiğinde"], 0, "Kazada hasar gören aracın yola çıkması güvenli mi diye özel muayene istenebilir. Sahip değişikliği veya rutin bakım özel muayene gerektirmez."],
["T", 14, "Kara yollarında araç kullanan bir sürücünün, aşağıdakilerden hangisini yapması yasaktır?", ["İki şeridi birden kullanması", "Aracını gidiş yönüne göre yolun en sağından sürmesi", "Gidişe ayrılan yol bölümünün en sol şeridini sürekli işgal etmekten kaçınması", "Şerit değiştirmeden önce, gireceği şeritte sürülen araçların güvenle geçişlerini beklemesi"], 0, "İki şeridi birden kullanmak, yani şerit çizgisinin üzerinde gitmek yasaktır; diğerleri doğru davranışlardır."],
["M", 14, "Seyir hâlindeki aracın gösterge panelinde aşağıdaki ikaz ışıklarından hangisinin yanması, trafik kurallarına uymak şartıyla derhâl durulmasını gerektirir?", ["Akü şarj ikaz ışığı", "Sol sinyal ikazı", "Arka cam rezistansı", "Uzun hüzmeli far ikazı"], 0, "Şarj ışığı aküye şarj gitmediğini gösterir; kayış kopmuşsa su pompası da durup hararet yapabilir. Güvenli yerde durulur."],
["M", 14, "Süspansiyon sisteminde bulunan ve yay salınım süresini kısaltan parça aşağıdakilerden hangisidir?", ["Rotil", "Aks", "Amortisör", "Şaft"], 2, "Amortisör yayların salınımını sönümler; araç zıplamaz, yol tutuşu artar."],
["M", 14, "İçten yanmalı motorlar hangi enerjiyi mekanik enerjiye dönüştürür?", ["Isı enerjisini", "Hidrolik enerjiyi", "Nükleer enerjiyi", "Elektrik enerjisini"], 0, "İçten yanmalı motor yakıtın yanmasıyla oluşan ısı enerjisini mekanik enerjiye çevirir."],
["M", 14, "Motordaki aşınmaları hangi sistem azaltır?", ["Şarj sistemi", "Marş sistemi", "Ateşleme sistemi", "Yağlama sistemi"], 3, "Yağlama sistemi hareketli parçalar arasında yağ tabakası oluşturarak sürtünmeyi ve aşınmayı azaltır."],
["M", 14, "Kontak anahtarı açıldığında (motor çalışmadan) gösterge panelindeki akü şarj ikaz ışığının yanması gerekir. Yanmıyorsa arıza aşağıdakilerden hangisinde olabilir?", ["Marş motorunda", "Motor devir göstergesinde", "Soğutma fanında", "Akü şarj ikaz ışığının ampulünde"], 3, "Kontak açıldığında şarj ışığının yanması gerekir; yanmıyorsa en olası neden ampulün arızalı olmasıdır.", "aku"],
["M", 14, "Aşağıdakilerden hangisi, motorun soğutma sisteminde donmayı önlemenin yanı sıra soğutma sıvısının geçtiği yerlerde korozyonu, paslanmayı ve kireç oluşumunu da engelleyerek parçaların ömrünü artırır?", ["Yağ", "Asit", "Saf su", "Antifriz"], 3, "Antifriz donmayı önler, ayrıca paslanmayı ve kireçlenmeyi engelleyerek soğutma sistemini korur."],
["M", 14, "Fren pedalına basıldığında fren lambaları yanmıyorsa sebebi aşağıdakilerden hangisidir?", ["Flaşör arızalıdır.", "Distribütör arızalıdır.", "Fren müşiri arızalıdır.", "Geri vites müşiri arızalıdır."], 2, "Fren lambalarını fren pedalına bağlı fren müşiri (anahtarı) yakar; arızalanırsa lambalar yanmaz."],
["M", 14, "Aşağıdakilerden hangisi motorda yapılan ve yakıt tasarrufuna etki eden ayarlardan biri değildir?", ["Far ayarı", "Buji ayarı", "Avans ayarı", "Rölanti ayarı"], 0, "Buji, avans ve rölanti ayarı yakıt tüketimini etkiler; far ayarının yakıtla ilgisi yoktur."],
["M", 14, "Motor çalışırken gösterge panelinde şekildeki ikaz ışığı yanıyorsa sebebi aşağıdakilerden hangisi olabilir?", ["Yağ seviyesinin azalması", "Depodaki yakıtın azalması", "Fren hidroliğinin eksilmesi", "Radyatörde antifrizin olmaması"], 0, "Yağ basıncı ışığı çoğunlukla yağ seviyesinin azaldığını gösterir; motor hemen durdurulur.", "yag"],
["M", 14, "Araçta kullanım ömrünü tamamlamış lastiklerin kullanılması aşağıdakilerden hangisini artırır?", ["Sürüş konforunu", "Trafik kazası riskini", "Direksiyon hâkimiyetini", "Aracın yol üzerinde tutunmasını DENEME SINAVI 4 -"], 1, "Ömrünü doldurmuş lastik yolu tutmaz, fren mesafesi uzar ve patlayabilir; kaza riski artar."],
["I", 15, "Tıbbi yardım haberleşmesinde iletilecek mesaj nasıl olmalıdır?", ["Gizli", "Şifreli", "Ayrıntılı ve uzun", "Kısa, öz ve anlaşılır"], 3, "112'ye verilen bilgi kısa, öz ve anlaşılır olmalıdır: ne oldu, nerede, kaç yaralı var, durumları nasıl."],
["I", 15, "Aşağıdakilerden hangisi, kazazedenin ikinci değerlendirilme aşamalarından olan 'Görüşerek Bilgi Edinme' basamağında yer alır?", ["Solunum sayısının değerlendirilmesi", "Hoşgörülü ve nazik davranılması", "Bilinç düzeyinin kontrol edilmesi", "Cilt renginin değerlendirilmesi"], 1, "İkinci değerlendirmede yaralıyla görüşülerek bilgi alınır; bunun için hoşgörülü ve nazik davranmak gerekir. Solunum, bilinç ve cilt kontrolü baştan aşağı muayenenin parçasıdır."],
["I", 15, "'Ağızdan ağıza' suni solunum yapılacak olan kazazedede boyun travması yoksa verilecek en doğru pozisyon aşağıdakilerden hangisidir?", ["Başın sert bir zeminde hafif yana dönük olması", "Başının altına yastık konularak sırtüstü yatırılması", "Sırtüstü yatar pozisyonda iken başının geriye doğru olması", "Sırtüstü yatar pozisyonda iken çenesinin göğsüne değecek şekilde olması"], 2, "Baş geri, çene yukarı pozisyonu dilin geriye kaçmasını önler ve hava yolunu açar; yastık ve çeneyi göğse değdirmek yolu kapatır."],
["I", 15, "Kalp masajı uygulaması, aşağıdaki durumların hangisinde sonlandırılır?", ["Kalp çalıştığında", "112'ye haber verildiğinde", "Kazazedenin akrabaları geldiğinde", "Kazazedenin cildinde kızarıklıklar gözlemlendiğinde"], 0, "Kalp masajı kalp yeniden çalışınca, sağlık ekibi devralınca veya ilk yardımcı tükenince bırakılır."],
["I", 15, "Aşağıdakilerden hangisi kılcal damar kanamasının özelliğidir?", ["Koyu renkli ve taşma tarzında kan akması", "Sızıntı biçiminde ve hafif bir kanama olması", "Yüksek basınçla akması ve zor durdurulabilmesi", "Yara ağzından kalp atımlarına uyumlu şekilde fışkırarak akması"], 1, "Kılcal damarlar en ince damarlardır, basınçları düşüktür; kan sızar ve çoğu zaman kendiliğinden durur. Fışkırarak ve yüksek basınçla akan atardamar, koyu renkli ve taşarak akan toplardamar kanamasıdır."],
["I", 15, "I. İp, tel gibi kesici malzemelerin kullanılması\nII. Uygulamanın yapıldığı saatin bir kâğıda yazılıp kazazedenin üzerine asılması\nIII. Uzvun koptuğu bölgeye en yakın ve deri bütünlüğü bozulmamış olan yere uygulanması.\nVerilenlerden hangileri turnike uygulamasında dikkat edilecek hususlardandır?", ["Yalnız I", "I ve II", "II ve III", "I, II ve III"], 2, "Turnikede ip ve tel gibi kesici malzeme kullanılmaz. Saat yazılıp yaralının üzerine asılır; turnike kopan bölgeye en yakın sağlam deriye uygulanır."],
["I", 15, "Aşağıdakilerin hangisinde şok pozisyonu vermek sakıncalıdır?", ["Bacağında kanama olanlarda", "El bileğinde açık kırık olanlarda", "Tansiyonu düşük ve nabız alınamayanlarda", "Burnundan ve kulağından kanama olanlarda"], 3, "Burun veya kulaktan kanama kafa yaralanmasını düşündürür; bacakları kaldırmak kafa içi basıncını artırabilir."],
["I", 15, "Aşağıdakilerden hangisi yaralanmalarda uygulanan genel ilk yardım kurallarından biri değildir?", ["Kanamanın durdurulması", "Yara yerinin değerlendirilmesi", "Yara üzerinin pamukla kapatılması", "Yaşam bulgularının kontrol edilmesi"], 2, "Pamuk liflenip yaraya yapışır ve enfeksiyon riskini artırır; yara temiz bir bezle veya sargıyla kapatılır."],
["I", 15, "Omurga yaralanmalarında geçici veya kalıcı felçlerin oluşmasının nedeni aşağıdakilerden hangisidir?", ["Omuriliğin baskı altında olması ya da zedelenmesi", "Taşıma sırasında baş, boyun ve gövde ekseninin korunması", "Kazazedenin sırt üstü, düz pozisyonda yatırılması", "Kazazedenin hareketsiz hâle getirilmesi"], 0, "Felci omuriliğin ezilmesi veya zedelenmesi yapar. Diğer üç şık, omurgayı korumak için yapılan doğru uygulamalardır."],
["I", 15, "Kişinin çevre ile bağlantısının tamamen kesildiği, uyaranlara cevap veremediği derin bilinç kaybına ne denir?", ["Hâlsizlik", "Şok", "Kansızlık", "Koma"], 3, "Koma, uyaranlara yanıt alınamayan derin bilinç kaybıdır. Bayılma ise kısa süreli ve geçicidir."],
["I", 15, "Darbe sonucu kemiğin anatomik bütünlüğünün bozulmasına ne ad verilir?", ["Kırık", "Çıkık", "Yanık", "Burkulma"], 0, "Kemiğin bütünlüğünün darbe sonucu bozulmasına kırık denir. Eklem yüzeylerinin ayrılması çıkık, geçici ayrılması burkulmadır."],
["I", 15, "Kazazedenin omuriliğine zarar vermeden, ilk yardımcının arkasına geçip bir koluyla çenesini, diğer koluyla gövdesini kavrayarak araçtan çıkarması tekniğine ne ad verilir?", ["İtfaiyeci yöntemi", "Rautek manevrası", "Sürükleme yöntemi", "Heimlich manevrası"], 1, "Rautek manevrasında baş-boyun-gövde ekseni korunarak kazazede araçtan hızla çıkarılır. Heimlich hava yolu tıkanıklığında, itfaiyeci yöntemi omuzda taşımada kullanılır."],
["T", 15, "Aşağıdakilerden hangisi, kişiye bağlı gelişen trafik kazası nedenlerinden biri değildir?", ["Alkol ve madde bağımlılığı", "Uzun yolculuklar ve yorgunluk", "Tehlikeye atılmaya hazır kişilik yapısı", "Olumsuz hava şartları ve yolların bozuk olması"], 3, "Alkol, yorgunluk ve risk alan kişilik kişiye bağlı nedenlerdir; kötü hava ve bozuk yol ise çevreye bağlı nedenlerdir."],

["T", 15, "Trafik görevlisi kollarını iki yana açmış olarak duruyorsa aşağıdakilerden hangisi doğrudur?", ["Görevlinin ön ve arka cephesinde kalan yollar trafiğe açıktır.", "Görevlinin sağ ve sol kol istikametinde kalan yollar trafiğe açıktır.", "Yol bütün yönlerdeki trafiğe kapalıdır.", "Yol bütün yönlerdeki trafiğe açıktır."], 1, "Görevlinin kollarının yönündeki (sağ ve sol yanındaki) yollar açıktır; yüzünü veya sırtını gören sürücüler durur."],

["I", 16, "Aşağıdakilerden hangisi, kaza sonrası güvenli bir ortamın oluşturulması için yapılması gereken uygulamalardandır?", ["Yardımı güçleştirecek meraklı kişilerin olay yerinden uzaklaştırılması", "Olay yerinin diğer araç sürücüleri tarafından görünmesinin engellenmesi", "Araç LPG'li ise bagajında bulunan tüpün vanasının kapatılmaması", "Kazaya uğrayan aracın kontağının açık bırakılması"], 0, "Meraklı kalabalık yardımı güçleştirir; uzaklaştırılır. Kontak kapatılır, LPG vanası kapatılır, olay yeri diğer sürücülere gösterilir."],

const PATHS = {SL:"M110 150 V112 Q110 90 88 90 H40", SS:"M110 150 V40", SR:"M110 150 V126 Q110 110 128 110 H170", NS:"M90 50 V160"};
function scene(k){
  const c = SC[k]; if(!c) return "";
  let s = `<rect width="200" height="200" style="fill:var(--scene)"/>`;
  if(c.round){
    s += `<rect x="80" y="0" width="40" height="200" fill="#6b7280"/><rect x="0" y="80" width="200" height="40" fill="#6b7280"/><circle cx="100" cy="100" r="58" fill="#6b7280"/><circle cx="100" cy="100" r="26" fill="#7fae6a" stroke="#fff" stroke-width="2"/>`;
  } else {
    s += `<rect x="80" y="0" width="40" height="200" fill="#6b7280"/><rect x="0" y="80" width="200" height="40" fill="#6b7280"/>`;
    if(c.dirt) s += `<rect x="80" y="120" width="40" height="80" fill="#a8835a"/><rect x="0" y="80" width="200" height="40" fill="#6b7280"/>`;
    s += `<g stroke="#fff" stroke-width="2" stroke-dasharray="8 7"><path d="M100 0 V78 M100 122 V200 M0 100 H78 M122 100 H200"/></g>`;
  }
  if(c.ped){ s += `<g fill="#fff">${[82,90,98,106,114].map(x=>`<rect x="${x}" y="126" width="5" height="14"/>`).join("")}</g><circle cx="96" cy="128" r="5" fill="#152033"/><rect x="92.5" y="133" width="7" height="11" rx="3" fill="#152033"/>`; }
  s += `<defs><marker id="ah${k}" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#f4c21b"/></marker></defs>`;
  (c.cars||[]).forEach(v=>{ if(v.t){ s += `<path d="${PATHS[v.p+v.t]}" fill="none" stroke="#f4c21b" stroke-width="3" stroke-dasharray="6 4" marker-end="url(#ah${k})"/>`; }});
  (c.signs||[]).forEach(g=>{ const [x,y]=SPOS[g.p]; s += `<g transform="translate(${x-13} ${y-13}) scale(.22)">${SIGN[g.k]}</g>`; });
  (c.cars||[]).forEach(v=>{
    const [x,y,r]=POS[v.p];
    const body = v.amb ? `<rect x="-9" y="-15" width="18" height="30" rx="4" fill="#fff" stroke="${R}" stroke-width="2"/><rect x="-2" y="-2" width="4" height="12" fill="${R}"/><rect x="-6" y="2" width="12" height="4" fill="${R}"/>` : `<rect x="-9" y="-15" width="18" height="30" rx="4" fill="${v.n==="1"?"#1d4f9c":"#e0662a"}"/><rect x="-7" y="-11" width="14" height="6" rx="1" fill="rgba(255,255,255,.65)"/>`;
    s += `<g transform="translate(${x} ${y}) rotate(${r})">${body}</g>`;
    const lx = v.p==="E"?x:v.p==="W"?x:x+20, ly = v.p==="E"||v.p==="W"? y-20 : y;
    s += `<circle cx="${lx}" cy="${ly}" r="9" fill="#fff" stroke="#152033" stroke-width="1.5"/><text x="${lx}" y="${ly+4.5}" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="12" fill="#152033">${v.n}</text>`;
  });
  return `<svg viewBox="0 0 200 200" role="img" aria-label="Kavşak şeması">${s}</svg>`;
}

const shuffle = a => {a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

// ---------- Sınav ----------
function start(id){
  let list;
  if(DERS[id]){
    list = shuffle(kursDers(DERS[id]));
  } else if(id>=11 && id<=18){
    list = Q.filter(q=>q[1]===id);
  } else if(POOL[id]){
    const f=POOL[id];
    const pick = id===7
      ? (k,n)=>{ const lv=[q=>q[1]<=4,q=>q[1]===5,q=>q[1]===6], base=Math.floor(n/3), extra=n-base*3, order=shuffle([0,1,2]);
                 return lv.flatMap((g,i)=>shuffle(Q.filter(q=>q[0]===k&&g(q))).slice(0, base+(order.indexOf(i)<extra?1:0))) }
      : (k,n)=>shuffle(Q.filter(q=>q[0]===k&&f(q))).slice(0,n);
    list = shuffle([...pick("T",23),...pick("I",12),...pick("M",9),...pick("A",6)]);
  } else list = Q.filter(q=>q[1]===id);
  S = {id, set:ALLSETS().find(s=>s.id===id), list, ans:Array(list.length).fill(null), i:0, left:Math.round(list.length*54), timed:timed(), confirm:false};
  clearInterval(tick);
  if(S.timed) tick = setInterval(()=>{S.left--; const t=document.getElementById("t"); if(t){t.textContent=fmt(S.left); t.classList.toggle("low",S.left<120)} if(S.left<=0) finish()},1000);
  quiz(); scrollTo(0,0);
}

function quiz(){
  setMode(true);
  const q=S.list[S.i], n=S.list.length, done=S.ans.filter(a=>a!==null).length;
  const open = document.querySelector("details.qlist")?.open;
  app.innerHTML = `
  <div class="topbar">
    <div class="bar"><button class="x" id="quit">✕ Çık</button><h2>${S.set.ad}</h2>${S.timed?`<span class="timer${S.left<120?" low":""}" id="t" aria-label="Kalan süre">${fmt(S.left)}</span>`:`<span class="timer free">Süresiz</span>`}</div>
    <div class="progress" aria-hidden="true"><i style="width:${done/n*100}%"></i></div>
  </div>
  ${S.quitAsk?`<div class="confirm"><p><b>Sınavdan çıkmak istiyor musun?</b> Cevapların kaydedilmez.</p><div class="row"><button class="btn warn" id="qy">Evet, çık</button><button class="btn" id="qn">Devam et</button></div></div>`:""}
  <article class="qcard">
    <div class="qmeta"><span class="chip">Soru ${S.i+1} / ${n}</span><span class="chip">${KAT[q[0]]}${S.id===7?` · ${LVNAME(q)}`:""}</span></div>
    ${fig(q[6])}
    <p class="qtext">${esc(q[2])}</p>
    <div class="opts">${q[3].map((o,j)=>`<button class="opt${S.ans[S.i]===j?" sel":""}" data-j="${j}"><span class="l">${"ABCD"[j]}</span><span>${esc(o)}</span></button>`).join("")}</div>
  </article>
  ${S.confirm?`<div class="confirm" id="cf"><p><b>${n-done} soru boş.</b> Yine de bitirmek istiyor musun?</p><div class="row"><button class="btn warn" id="yes">Evet, bitir</button><button class="btn" id="no">Devam et</button></div></div>`:""}
  <details class="qlist"${open?" open":""}><summary>Soru listesi · ${done}/${n} cevaplandı</summary>
    <nav class="grid">${S.list.map((_,k)=>`<button data-k="${k}" class="${S.ans[k]!==null?"done":""}${k===S.i?" cur":""}" aria-label="Soru ${k+1}">${k+1}</button>`).join("")}</nav>
  </details>
  <button class="btn warn" id="end2">Sınavı bitir</button>`;
  bottom(`<button class="btn" id="prev" ${S.i===0?"disabled":""}>‹ Önceki</button>${S.i<n-1?`<button class="btn primary" id="next">Sonraki ›</button>`:`<button class="btn warn" id="end">Sınavı bitir</button>`}`);
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{S.ans[S.i]=+b.dataset.j; S.confirm=false; quiz(); setTimeout(()=>{ if(S && S.i<n-1){S.i++; quiz(); scrollTo(0,0)} },250)});
  app.querySelectorAll(".grid button").forEach(b=>b.onclick=()=>{S.i=+b.dataset.k; quiz(); scrollTo(0,0)});
  const on=(id,f)=>{const e=document.getElementById(id); if(e) e.onclick=f};
  on("prev",()=>{S.i--;quiz();scrollTo(0,0)}); on("next",()=>{S.i++;quiz();scrollTo(0,0)});
  const tryEnd=()=>{ if(S.ans.includes(null)){S.confirm=true;quiz();document.getElementById("cf")?.scrollIntoView({block:"center"})} else finish() };
  on("end",tryEnd); on("end2",tryEnd); on("yes",finish); on("no",()=>{S.confirm=false;quiz()});
  on("quit",()=>{S.quitAsk=true;quiz();scrollTo(0,0)}); on("qy",home); on("qn",()=>{S.quitAsk=false;quiz()});
}

function finish(){
  clearInterval(tick);
  const n=S.list.length;
  let dogru=0,yanlis=0,bos=0; const kat={};
  S.list.forEach((q,k)=>{
    kat[q[0]]=kat[q[0]]||{d:0,t:0}; kat[q[0]].t++;
    if(S.ans[k]===null) bos++; else if(S.ans[k]===q[4]){dogru++;kat[q[0]].d++} else yanlis++;
  });
  const puan=dogru*2;
  S.res={n,dogru,yanlis,bos,kat,puan,gecti:puan>=70,gecen:S.timed?fmt(45*60-S.left):null};
  const best=store.get("best")||{}; if(best[S.id]==null||puan>best[S.id]){best[S.id]=puan; store.set("best",best)}
  result();
}
const stOf = k => { const a=S.ans[k], q=S.list[k]; return a===null?"empty":a===q[4]?"ok":"bad" };
const idsOf = f => S.list.map((_,k)=>k).filter(k=>f==="all"||(f==="miss"?stOf(k)!=="ok":stOf(k)===f));

    <div class="actions"><button class="btn primary" id="again">Tekrar çöz</button><button class="btn" id="home">Ana sayfa</button></div>

  <div class="key">${S.list.map((q,k)=>{const a=S.ans[k],st=stOf(k);return `<button class="kc ${st}" data-k="${k}" aria-label="${k+1}. soru, doğru cevap ${"ABCD"[q[4]]}"><small>${k+1}</small><b>${"ABCD"[q[4]]}</b>${st==="bad"?`<em class="ys">${"ABCD"[a]}</em>`:""}</button>`}).join("")}</div>`;

function review(ids,pos,title){
  setMode(true);
  const k=ids[pos], q=S.list[k], a=S.ans[k], st=stOf(k);
  const head = st==="ok"?`<b>Doğru bildin</b>`:st==="empty"?`<b>Boş bıraktın</b>`:`<b>Senin cevabın: ${"ABCD"[a]}) ${esc(q[3][a])}</b>`;
  app.innerHTML = `
  <div class="topbar">
    <div class="bar"><button class="x" id="back">‹ Sonuç</button><h2>${title}</h2><span class="timer free">${pos+1}/${ids.length}</span></div>
    <div class="progress" aria-hidden="true"><i style="width:${(pos+1)/ids.length*100}%"></i></div>
  </div>
  <article class="qcard">
    <div class="qmeta"><span class="chip">${k+1}. soru · ${LVNAME(q)}</span><span class="chip">${KAT[q[0]]}</span></div>
    ${fig(q[6])}
    <p class="qtext">${esc(q[2])}</p>
    <div class="opts">${q[3].map((o,j)=>`<div class="opt${j===q[4]?" right":""}${j===a&&j!==q[4]?" wrong":""}"><span class="l">${"ABCD"[j]}</span><span>${esc(o)}${j===q[4]?" <b>✓ doğru cevap</b>":j===a?" <b>✗ senin cevabın</b>":""}</span></div>`).join("")}</div>
    <div class="feedback ${st==="ok"?"ok":"bad"}">${head}<p><b>Doğrusu ${"ABCD"[q[4]]}) ${esc(q[3][q[4]])}.</b></p><p><b>Neden?</b> ${esc(q[5])}</p></div>
  </article>`;
  bottom(`<button class="btn" id="rp" ${pos===0?"disabled":""}>‹ Önceki</button>${pos<ids.length-1?`<button class="btn primary" id="rn">Sonraki ›</button>`:`<button class="btn primary" id="rd">Sonuca dön</button>`}`);
  const on=(id,f)=>{const e=document.getElementById(id); if(e) e.onclick=f};
  on("rp",()=>{review(ids,pos-1,title);scrollTo(0,0)}); on("rn",()=>{review(ids,pos+1,title);scrollTo(0,0)});
  on("rd",()=>result()); on("back",()=>result());
  scrollTo(0,0);
}

// ---------- Antrenman (anında geri bildirim) ----------
function practice(kind){
  clearInterval(tick); S=null;
  let items;
  if(kind==="levha"){
    items = shuffle(LEVHA).map(([k,dogru,yanlis,ipucu])=>{const o=shuffle([dogru,...yanlis.split("|")]); return {fig:k, q:"Bu levha ne anlatır?", o, a:o.indexOf(dogru), tip:ipucu}});
  } else if(kind==="gosterge"){
    const all=GOSTERGE.map(g=>g[1]);
    items = shuffle(GOSTERGE).map(([k,dogru,tip])=>{const o=shuffle([dogru,...shuffle(all.filter(x=>x!==dogru)).slice(0,3)]); return {fig:k, q:"Bu ikaz lambası ne anlatır?", o, a:o.indexOf(dogru), tip}});
  } else {
    items = shuffle(GECIS).map(([k,q,o,a,tip])=>({fig:k, q, o, a, tip}));
  }
  P = {kind, items, i:0, picked:null, score:0, title: kind==="levha"?"Levha Antrenmanı":kind==="gosterge"?"Gösterge Lambaları":"Geçiş Üstünlüğü"};
  pcard(); scrollTo(0,0);
}
function pcard(){
  setMode(true);
  const it=P.items[P.i], n=P.items.length, ans=P.picked!==null;
  app.innerHTML = `
  <div class="topbar">
    <div class="bar"><button class="x" id="quit">✕ Çık</button><h2>${P.title}</h2><span class="timer free">${P.i+1}/${n}</span></div>
    <div class="progress" aria-hidden="true"><i style="width:${(P.i+(ans?1:0))/n*100}%"></i></div>
  </div>
  <article class="qcard">
    ${fig(it.fig)}
    <p class="qtext">${esc(it.q)}</p>
    <div class="opts">${it.o.map((o,j)=>`<button class="opt${ans&&j===it.a?" right":""}${ans&&j===P.picked&&j!==it.a?" wrong":""}" data-j="${j}" ${ans?"disabled":""}><span class="l">${"ABCD"[j]}</span><span>${esc(o)}</span></button>`).join("")}</div>
    ${ans?`<div class="feedback ${P.picked===it.a?"ok":"bad"}"><b>${P.picked===it.a?"Doğru!":"Doğrusu: "+esc(it.o[it.a])}</b><p>${esc(it.tip)}</p></div>`:""}
  </article>`;
  bottom(ans?`<button class="btn primary" id="pn">${P.i<n-1?"Sonraki ›":"Sonucu gör"}</button>`:`<button class="btn" disabled>Bir şık seç</button>`);
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{ if(P.picked!==null) return; P.picked=+b.dataset.j; if(P.picked===it.a) P.score++; pcard(); document.querySelector(".feedback")?.scrollIntoView({behavior:"smooth",block:"nearest"}) });
  const pn=document.getElementById("pn"); if(pn) pn.onclick=()=>{ if(P.i<n-1){P.i++;P.picked=null;pcard();scrollTo(0,0)} else pdone() };
  document.getElementById("quit").onclick=home;
}
function pdone(){
  setMode(false); bottom(null);
  const n=P.items.length;
  app.innerHTML = `
  <section class="result">
    <div class="label">${P.title} · Bitti</div>
    <div class="plate"><span class="tr">TR</span><span class="pts">${P.score}/${n}</span></div>
    <div class="verdict ${P.score/n>=.7?"pass":"fail"}">${P.score===n?"Hepsini bildin!":P.score/n>=.7?"Gözün alışıyor":"Bir tur daha"}</div>
    <p class="note">Antrenmanı tekrarladıkça sıra değişir. ${P.kind==="gosterge"?"Renge bak: kırmızı hemen dur, sarı en kısa sürede kontrol ettir, yeşil ve mavi sadece bilgi.":P.kind==="levha"?"Şekil ve renk kuralını aklında tut: üçgen uyarı, kırmızı daire yasak, mavi daire mecburiyet, mavi kare bilgi.":"Sıralamayı unutma: görevli, ışık, levha, sonra kavşak kuralları."}</p>
    <div class="actions"><button class="btn primary" id="again">Tekrar</button><button class="btn" id="home">Ana sayfa</button></div>
  </section>`;
  document.getElementById("again").onclick=()=>practice(P.kind);
  document.getElementById("home").onclick=home;
  scrollTo(0,0);
}
home();
</script>

if("serviceWorker" in navigator && location.protocol==="https:"){
  window.addEventListener("load",()=>navigator.serviceWorker.register("/sw.js").catch(()=>{}));
