# Netlify ayarları: klasör olduğu gibi yayınlanır. Derleme adımı: replikler ve duvar-kagitlari klasörlerindeki videoların listesini çıkarmak.
[build]
  publish = "."
  command = "node scripts/replik-liste.mjs && node scripts/duvar-liste.mjs"
  # Bildirim gönderen sunucu fonksiyonu (ek kurulum gerektirmez)
  functions = "netlify/functions"

# Güncelleme yaptığımızda herkes yeni sürümü hemen alsın (tarayıcı eski dosyayı önbellekte tutmasın)
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "no-cache"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# kısa yönetim adresi: /admin
[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

# replik videoları değişmez (aynı adla yeni dosya atılırsa ad değişsin): tarayıcı bir gün saklasın
[[headers]]
  for = "/replikler/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# video duvar kağıtları büyük dosyalar: tarayıcı bir hafta saklasın (her açılışta yeniden inmesin)
[[headers]]
  for = "/duvar-kagitlari/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
