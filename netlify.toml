# Netlify ayarları: derleme yok, klasör olduğu gibi yayınlanır.
[build]
  publish = "."
  # Bildirim gönderen sunucu fonksiyonu (ek kurulum gerektirmez)
  functions = "netlify/functions"

# Güncelleme yaptığımızda herkes yeni sürümü hemen alsın (tarayıcı eski dosyayı önbellekte tutmasın)
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "no-cache"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
